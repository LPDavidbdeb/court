<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1055px;height:1169px;background:#FFFFFF;" width="1055px" height="1169px" viewBox="0 0 1055 1169" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="358.944" y="30.78" fill="#000" font-size="14" textLength="335.296" font-weight="700" font-family="Helvetica">US-C-08 — Composer et insérer une citation fidèle</text></g><rect x="20" y="51.49" width="1008.184" height="13" fill="none" style="stroke:none;"/><ellipse cx="167.863" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="63.562" y="109.49" width="208.602" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="73.562" y="129.5" fill="#172B4D" font-size="13" textLength="169.076" font-family="Helvetica">Choisir les passages sources</text><text x="73.562" y="142.5" fill="#172B4D" font-size="13" textLength="188.602" font-family="Helvetica">et leur ordre dans la composition</text><rect x="33.585" y="627.99" width="268.555" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="43.585" y="648" fill="#172B4D" font-size="13" textLength="176.998" font-family="Helvetica">Déclarer les omissions visibles</text><text x="43.585" y="661" fill="#172B4D" font-size="13" textLength="248.555" font-family="Helvetica">et les emphases structurées si nécessaires</text><rect x="26" y="693.99" width="283.726" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="714" fill="#172B4D" font-size="13" textLength="263.726" font-family="Helvetica">Choisir l’emplacement dans l’occurrence cible</text><line x1="20" y1="51.49" x2="20" y2="1136.49" style="stroke:#000;stroke-width:1.5;"/><polygon points="521.161,175.49,693.887,175.49,705.887,187.49,693.887,199.49,521.161,199.49,509.161,187.49,521.161,175.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="521.161" y="191" fill="#172B4D" font-size="13" textLength="172.726" font-family="Helvetica">Passage d’un acte reproduit ?</text><text x="491.813" y="184.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="705.887" y="184.5" fill="#000" font-size="13" textLength="135.11" font-family="Helvetica">citation courriel ou PDF</text><rect x="345.403" y="209.49" width="242.549" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="355.403" y="229.5" fill="#172B4D" font-size="13" textLength="222.549" font-family="Helvetica">Identifier l’occurrence source complète</text><text x="355.403" y="242.5" fill="#172B4D" font-size="13" textLength="213.135" font-family="Helvetica">et vérifier sa certification sur l’original</text><rect x="607.952" y="209.49" width="280.838" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="617.952" y="229.5" fill="#172B4D" font-size="13" textLength="260.838" font-family="Helvetica">Demander le texte et la certification PHRASE</text><text x="617.952" y="242.5" fill="#172B4D" font-size="13" textLength="195.114" font-family="Helvetica">au fournisseur documentaire de A</text><polygon points="607.524,261.49,619.524,273.49,607.524,285.49,595.524,273.49,607.524,261.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="469.51,305.49,745.538,305.49,757.538,317.49,745.538,329.49,469.51,329.49,457.51,317.49,469.51,305.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="469.51" y="321" fill="#172B4D" font-size="13" textLength="276.028" font-family="Helvetica">Source, repères et certification actuels valides ?</text><text x="440.162" y="314.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="757.538" y="314.5" fill="#000" font-size="13" textLength="141.667" font-family="Helvetica">non ou capacité absente</text><rect x="319.726" y="339.49" width="255.568" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="329.726" y="359.5" fill="#172B4D" font-size="13" textLength="212.437" font-family="Helvetica">Lire le verbatim depuis le fournisseur</text><text x="329.726" y="372.5" fill="#172B4D" font-size="13" textLength="235.568" font-family="Helvetica">et garder les identités et repères sources</text><rect x="632.156" y="339.49" width="270.764" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="642.156" y="359.5" fill="#172B4D" font-size="13" textLength="161.872" font-family="Helvetica">Signaler la lacune et refuser</text><text x="642.156" y="372.5" fill="#172B4D" font-size="13" textLength="250.764" font-family="Helvetica">le nouveau rendu probatoire strict concerné</text><ellipse cx="767.538" cy="416.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="767.538" cy="416.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="464.56" y="495.99" width="285.929" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="474.56" y="516" fill="#172B4D" font-size="13" textLength="265.929" font-family="Helvetica">Refuser sans fusion ni troncature automatique</text><ellipse cx="607.524" cy="574.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="607.524" cy="574.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="474.915,447.49,740.133,447.49,752.133,459.49,740.133,471.49,474.915,471.49,462.915,459.49,474.915,447.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="611.524" y="481.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="474.915" y="463" fill="#172B4D" font-size="13" textLength="265.218" font-family="Helvetica">Chevauchement ambigu ou texte discordant ?</text><rect x="483.361" y="746.99" width="248.325" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="493.361" y="767" fill="#172B4D" font-size="13" textLength="228.325" font-family="Helvetica">Ancrer l’insertion sur le Statement porté</text><text x="493.361" y="780" fill="#172B4D" font-size="13" textLength="220.391" font-family="Helvetica">et sa VersionTexte, bornes [start, end[</text><rect x="475.033" y="861.49" width="264.981" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="485.033" y="881.5" fill="#172B4D" font-size="13" textLength="244.981" font-family="Helvetica">Demander un réancrage ou une correction</text><ellipse cx="607.524" cy="934.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="607.524" cy="934.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="478.175,812.99,736.873,812.99,748.873,824.99,736.873,836.99,478.175,836.99,466.175,824.99,478.175,812.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="611.524" y="847" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="478.175" y="828.5" fill="#172B4D" font-size="13" textLength="258.699" font-family="Helvetica">Texte changé ou remplacement recouvrant ?</text><rect x="445.783" y="987.49" width="323.481" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="455.783" y="1007.5" fill="#172B4D" font-size="13" textLength="303.481" font-family="Helvetica">Ordonner explicitement les insertions au même point</text><path d="M761.437,1032.49 L761.437,1059.49 L741.437,1063.49 L761.437,1067.49 L761.437,1094.49 A0,0 0 0 0 761.437,1094.49 L1022.378,1094.49 A0,0 0 0 0 1022.378,1094.49 L1022.378,1042.49 L1012.378,1032.49 L761.437,1032.49 A0,0 0 0 0 761.437,1032.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1012.378,1032.49 L1012.378,1042.49 L1022.378,1042.49 L1012.378,1032.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="767.437" y="1047.5" fill="#000" font-size="13" textLength="180.661" font-family="Helvetica">Numéro du paragraphe source,</text><text x="767.437" y="1060.5" fill="#000" font-size="13" textLength="226.186" font-family="Helvetica">identité du fragment et future sous-cote</text><text x="767.437" y="1073.5" fill="#000" font-size="13" textLength="159.688" font-family="Helvetica">sont trois notions distinctes.</text><text x="767.437" y="1086.5" fill="#000" font-size="13" textLength="239.941" font-family="Helvetica">Aucune substitution globale dans le texte.</text><rect x="473.611" y="1040.49" width="267.825" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="483.611" y="1060.5" fill="#172B4D" font-size="13" textLength="242.817" font-family="Helvetica">Rendre le texte échappé et la composition</text><text x="483.611" y="1073.5" fill="#172B4D" font-size="13" textLength="247.825" font-family="Helvetica">avec ses renvois issus du résultat commun</text><ellipse cx="607.524" cy="1125.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="607.524" cy="1125.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="313.726" y1="51.49" x2="313.726" y2="1136.49" style="stroke:#000;stroke-width:1.5;"/><line x1="1027.378" y1="51.49" x2="1027.378" y2="1136.49" style="stroke:#000;stroke-width:1.5;"/><line x1="167.863" y1="89.49" x2="167.863" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="163.863,99.49,167.863,109.49,171.863,99.49,167.863,103.49" fill="#444" style="strok