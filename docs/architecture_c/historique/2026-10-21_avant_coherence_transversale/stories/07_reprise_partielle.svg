<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1172px;height:1041px;background:#FFFFFF;" width="1172px" height="1041px" viewBox="0 0 1172 1041" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="343.119" y="30.78" fill="#000" font-size="14" textLength="483.902" font-weight="700" font-family="Helvetica">US-C-07 — Reprendre une partie d’une analyse dans une autre rédaction</text></g><rect x="20" y="51.49" width="1125.141" height="13" fill="none" style="stroke:none;"/><ellipse cx="166.4" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="75.118" y="109.49" width="182.563" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="85.118" y="129.5" fill="#172B4D" font-size="13" textLength="162.563" font-family="Helvetica">Choisir le sous-arbre source</text><text x="85.118" y="142.5" fill="#172B4D" font-size="13" textLength="153.931" font-family="Helvetica">et la destination modifiable</text><rect x="49.461" y="241.49" width="233.878" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.461" y="261.5" fill="#172B4D" font-size="13" textLength="213.878" font-family="Helvetica">Choisir les usages et leurs sélections</text><rect x="26" y="294.49" width="280.8" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="314.5" fill="#172B4D" font-size="13" textLength="260.8" font-family="Helvetica">Traiter explicitement les réserves, prémisses,</text><text x="36" y="327.5" fill="#172B4D" font-size="13" textLength="189.325" font-family="Helvetica">insertions et liens sortant du bloc</text><path d="M312.019,352.49 L312.019,379.49 L292.019,383.49 L312.019,387.49 L312.019,414.49 A0,0 0 0 0 312.019,414.49 L574.351,414.49 A0,0 0 0 0 574.351,414.49 L574.351,362.49 L564.351,352.49 L312.019,352.49 A0,0 0 0 0 312.019,352.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M564.351,352.49 L564.351,362.49 L574.351,362.49 L564.351,352.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="318.019" y="367.5" fill="#000" font-size="13" textLength="171.253" font-family="Helvetica">Réserves incluses par défaut.</text><text x="318.019" y="380.5" fill="#000" font-size="13" textLength="166.912" font-family="Helvetica">Une omission exige un motif.</text><text x="318.019" y="393.5" fill="#000" font-size="13" textLength="213.205" font-family="Helvetica">L’application ne prétend pas détecter</text><text x="318.019" y="406.5" fill="#000" font-size="13" textLength="241.332" font-family="Helvetica">toutes les réserves implicites d’une prose.</text><rect x="40.781" y="360.49" width="251.239" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.781" y="380.5" fill="#172B4D" font-size="13" textLength="231.239" font-family="Helvetica">Décider des appuis d’ancêtres hors bloc</text><text x="50.781" y="393.5" fill="#172B4D" font-size="13" textLength="153.213" font-family="Helvetica">sans héritage automatique</text><path d="M299.375,904.99 L299.375,931.99 L279.375,935.99 L299.375,939.99 L299.375,966.99 A0,0 0 0 0 299.375,966.99 L566.073,966.99 A0,0 0 0 0 566.073,966.99 L566.073,914.99 L556.073,904.99 L299.375,904.99 A0,0 0 0 0 299.375,904.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M556.073,904.99 L556.073,914.99 L566.073,914.99 L556.073,904.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="305.375" y="920" fill="#000" font-size="13" textLength="217.502" font-family="Helvetica">La source, même gelée, reste intacte.</text><text x="305.375" y="933" fill="#000" font-size="13" textLength="187.91" font-family="Helvetica">Le partage d’un Statement exige</text><text x="305.375" y="946" fill="#000" font-size="13" textLength="190.779" font-family="Helvetica">un détachement avant réécriture.</text><text x="305.375" y="959" fill="#000" font-size="13" textLength="245.699" font-family="Helvetica">Une non-sélection n’est pas un retrait E01.</text><rect x="53.425" y="912.99" width="225.95" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="63.425" y="933" fill="#172B4D" font-size="13" textLength="180.642" font-family="Helvetica">Relire la reprise puis demander</text><text x="63.425" y="946" fill="#172B4D" font-size="13" textLength="205.95" font-family="Helvetica">les nouveaux examens nécessaires</text><ellipse cx="166.4" cy="997.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="166.4" cy="997.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="1008.99" style="stroke:#000;stroke-width:1.5;"/><rect x="763.057" y="175.49" width="202.108" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="773.057" y="195.5" fill="#172B4D" font-size="13" textLength="160.431" font-family="Helvetica">Proposer un plan de reprise</text><text x="773.057" y="208.5" fill="#172B4D" font-size="13" textLength="182.108" font-family="Helvetica">avec textes, usages et contexte</text><rect x="748.609" y="434.49" width="231.002" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="758.609" y="454.5" fill="#172B4D" font-size="13" textLength="211.002" font-family="Helvetica">Recontrôler sous transaction le plan,</text><text x="758.609" y="467.5" fill="#172B4D" font-size="13" textLength="147.424" font-family="Helvetica">la source et la destination</text><polygon points="753.176,500.49,975.046,500.49,987.046,512.49,975.046,524.49,753.176,524.49,741.176,512.49,753.176,500.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="753.176" y="516" fill="#172B4D" font-size="13" textLength="221.87" font-family="Helvetica">Plan courant et destination autorisée ?</text><text x="723.828" y="509.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="987.046" y="509.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="585.351" y="534.49" width="270.028" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="595.351" y="554.5" fill="#172B4D" font-size="13" textLength="250.028" font-family="Helvetica">Créer de nouvelles occurrences destination</text><text x="595.351" y="567.5" fill="#172B4D" font-size="13" textLength="158.983" font-family="Helvetica">et les seuls usages décidés</text><rect x="594.39" y="613.49" width="251.95" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="604.39" y="633.5" fill="#172B4D" font-size="13" textLength="231.95" font-family="Helvetica">Remapper les liens et insertions retenus</text><rect x="607.028" y="666.49" width="226.673" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="617.028" y="686.5" fill="#172B4D" font-size="13" textLength="206.673" font-family="Helvetica">Créer la filiation qualifiée par couple</text><text x="617.028" y="699.5" fill="#172B4D" font-size="13" textLength="150.287" font-family="Helvetica">et les groupes N:M exacts</text><rect x="875.379" y="534.49" width="264.956" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="885.379" y="554.5" fill="#172B4D" font-size="13" textLength="244.956" font-family="Helvetica">Refuser la reprise entière sans effet partiel</text><ellipse cx="1007.857" cy="611.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1007.857" cy="611.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="774.978" y="780.99" width="178.266" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="784.978" y="801" fill="#172B4D" font-size="13" textLength="158.266" font-family="Helvetica">Annuler toute la transaction</text><ellipse cx="864.111" cy="859.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="864.111" cy="859.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="779.182,732.49,949.039,732.49,961.039,744.49,949.039,756.49,779.182,756.49,767.182,744.49,779.182,732.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="868.111" y="766.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="779.182" y="748" fill="#172B4D" font-size="13" textLength="169.857" font-family="Helvetica">Une étape de copie échoue ?</text><line x1="579.351" y1="51.49" x2="579.351" y2="1008.99" style="stroke:#000;stroke-width:1.5;"/><line x1="1144.335" y1="51.49" x2="1144.335" y2="1008.99" style="stroke:#000;stroke-width:1.5;"/><line x1="166.4" y1="89.49" x2="166.4" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="162.4,99.49,166.4,109.49,170.4,99.49,166.4,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="166.4" y1="274.49" x2="166.4" y2="294.49" style="stroke:#444;stroke-width:1;"/><polygon points="162.4,284.49,166.4,294.49,170.4,284.49,166.4,288.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="166.4" y1="340.49" x2="166.4" y2="360.49" style="stroke:#444;stroke-width:1;"/><polygon points="162.4,350.49,166.4,360.49,170.4,350.49,166.4,354.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="166.4" y1="958.99" x2="166.4" y2="986.99" style="stroke:#444;stroke-width:1;"/><polygon points="162.4,976.99,166