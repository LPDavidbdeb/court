62.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="183.596" y="696.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="47" y="678" fill="#172B4D" font-size="13" textLength="265.192" font-family="Helvetica">Autre preuve nécessaire pour la même cible ?</text><polygon points="179.596,776.99,191.596,788.99,179.596,800.99,167.596,788.99,179.596,776.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="20" y1="51.49" x2="20" y2="908.99" style="stroke:#000;stroke-width:1.5;"/><rect x="475.5" y="228.49" width="296.764" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="485.5" y="248.5" fill="#172B4D" font-size="13" textLength="276.764" font-family="Helvetica">Développer uniquement les sélections explicites</text><text x="485.5" y="261.5" fill="#172B4D" font-size="13" textLength="104.063" font-family="Helvetica">de cette utilisation</text><rect x="510.535" y="342.99" width="226.692" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="520.535" y="363" fill="#172B4D" font-size="13" textLength="168.384" font-family="Helvetica">Vérifier le contenant désigné,</text><text x="520.535" y="376" fill="#172B4D" font-size="13" textLength="206.692" font-family="Helvetica">l’appartenance et l’ordre des photos</text><polygon points="522.357,408.99,725.406,408.99,737.406,420.99,725.406,432.99,522.357,432.99,510.357,420.99,522.357,408.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="522.357" y="424.5" fill="#172B4D" font-size="13" textLength="203.049" font-family="Helvetica">Informations vérifiées disponibles ?</text><text x="493.009" y="418" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="737.406" y="418" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="361.192" y="442.99" width="249.081" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="371.192" y="463" fill="#172B4D" font-size="13" textLength="229.081" font-family="Helvetica">Retenir les seules photos sélectionnées</text><text x="371.192" y="476" fill="#172B4D" font-size="13" textLength="210.99" font-family="Helvetica">et conserver leur Event source intact</text><rect x="630.273" y="442.99" width="263.515" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="640.273" y="463" fill="#172B4D" font-size="13" textLength="156.083" font-family="Helvetica">Signaler CF4 non satisfaite</text><text x="640.273" y="476" fill="#172B4D" font-size="13" textLength="243.515" font-family="Helvetica">et refuser la qualification stricte concernée</text><ellipse cx="762.031" cy="519.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="762.031" cy="519.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="524.88,294.49,722.883,294.49,734.883,306.49,722.883,318.49,524.88,318.49,512.88,306.49,524.88,294.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="627.882" y="328.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="524.88" y="310" fill="#172B4D" font-size="13" textLength="198.002" font-family="Helvetica">Photo utilisée à travers un Event ?</text><polygon points="623.882,550.99,635.882,562.99,623.882,574.99,611.882,562.99,623.882,550.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M775.63,593.49 L775.63,613.99 L755.63,617.99 L775.63,621.99 L775.63,642.49 A0,0 0 0 0 775.63,642.49 L1025.71,642.49 A0,0 0 0 0 1025.71,642.49 L1025.71,603.49 L1015.71,593.49 L775.63,593.49 A0,0 0 0 0 775.63,593.49" style="stroke:#98