/text><text x="668.56" y="312.5" fill="#172B4D" font-size="13" textLength="217.471" font-family="Helvetica">et son Document PRODUCED propre</text><polygon points="674.676,353.49,879.915,353.49,891.915,365.49,879.915,377.49,674.676,377.49,662.676,365.49,674.676,353.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="674.676" y="369" fill="#172B4D" font-size="13" textLength="205.239" font-family="Helvetica">Version issue d’une version gelée ?</text><text x="645.328" y="362.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="891.915" y="362.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="525.248" y="387.49" width="254.857" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="535.248" y="407.5" fill="#172B4D" font-size="13" textLength="234.857" font-family="Helvetica">Ouvrir un nouveau brouillon avec filiation</text><text x="535.248" y="420.5" fill="#172B4D" font-size="13" textLength="182.832" font-family="Helvetica">sans modifier le contenu ancien</text><rect x="817.139" y="387.49" width="169.551" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="827.139" y="407.5" fill="#172B4D" font-size="13" textLength="149.551" font-family="Helvetica">Ouvrir le premier brouillon</text><polygon points="777.295,439.49,789.295,451.49,777.295,463.49,765.295,451.49,777.295,439.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="655.281" y="536.49" width="244.028" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="665.281" y="556.5" fill="#172B4D" font-size="13" textLength="179.213" font-family="Helvetica">Autoriser les usages de preuve</text><text x="665.281" y="569.5" fill="#172B4D" font-size="13" textLength="224.028" font-family="Helvetica">uni