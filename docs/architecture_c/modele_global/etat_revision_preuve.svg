<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1579px;height:846px;background:#FFFFFF;" width="1579px" height="846px" viewBox="0 0 1579 846" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="584.605" y="23.535" fill="#000" font-size="14" textLength="403.423" font-weight="700">Architecture C — Cycle d'une révision d'arbre de preuve</text></g><g class="entity" data-qualified-name="B" id="ent0001" data-source-line="8"><rect x="530.13" y="195.488" width="475.332" height="108.33" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="4" ry="4"/><line x1="530.13" y1="240.82" x2="1005.462" y2="240.82" style="stroke:#2563EB;stroke-width:0.5;"/><text x="638.538" y="214.99" fill="#000" font-size="15" textLength="83.21">BROUILLON</text><text x="638.538" y="232.656" fill="#000" font-size="15" textLength="258.516">révision modifiable sous conditions</text><text x="535.13" y="260.322" fill="#000" font-size="15" textLength="455.332">éditer [aucun usage non ciblé affecté] / recontrôler les entrées</text><text x="535.13" y="277.988" fill="#000" font-size="15" textLength="417.795">autres usages affectés / créer une AUTRE révision entière</text><text x="535.13" y="295.654" fill="#000" font-size="15" textLength="442.485">gel échoué / ne publier aucune référence historique partielle</text></g><g class="entity" data-qualified-name="I" id="ent0002" data-source-line="9"><rect x="501.74" y="439.658" width="532.117" height="90.664" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="4" ry="4"/><line x1="501.74" y1="484.99" x2="1033.857" y2="484.99" style="stroke:#2563EB;stroke-width:0.5;"/><text x="661.399" y="459.16" fill="#000" font-size="15" textLength="85.144">IMMUTABLE</text><text x="661.399" y="476.826" fill="#000" font-size="15" textLength="212.798">révision engagée dans un gel</text><text x="506.74" y="504.492" fill="#000" font-size="15" textLength="512.117">réutiliser dans une autre VersionActe / conserver cette révision exacte</text><text x="506.74" y="522.158" fill="#000" font-size="15" textLength="491.821">modifier / créer une AUTRE révision BROUILLON de la même Preuve</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="11"><ellipse cx="767.79" cy="53.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M6,204.488 L6,294.818 A4,4 0 0 0 10,298.818 L491.589,298.818 A4,4 0 0 0 495.589,294.818 L495.589,253.658 L529.63,249.658 L495.589,245.658 L495.589,210.488 L485.589,200.488 L10,200.488 A4,4 0 0 0 6,204.488" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><path d="M485.589,200.488 L485.589,208.488 A2,2 0 0 0 487.589,210.488 L495.589,210.488 L485.589,200.488" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><text x="12" y="219.99" fill="#000" font-size="15" textLength="383.928">Le diagramme suit UNE révision, pas toute la Preuve.</text><text x="12" y="237.656" fill="#000" font-size="15" textLength="298.828">Preuve = identité durable; 1..N révisions.</text><text x="12" y="255.322" fill="#000" font-size="15" textLength="468.589">Révision = arbre simple complet, ses nœuds et leurs références.</text><text x="12" y="272.988" fill="#000" font-size="15" textLength="249.609">Seuls les groupes ont des enfants.</text><text x="12" y="290.654" fill="#000" font-size="15" textLength="415.679">Aucun moteur d'inférence ni renvoi entre preuves ajouté.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="27"><path d="M1068.95,439.818 L1068.95,480.988 L1034.25,484.988 L1068.95,488.988 L1068.95,530.148 A4,4 0 0 0 1072.95,534.148 L1560.633,534.148 A4,4 0 0 0 1564.633,530.148 L1564.633,445.818 L1554.633,435.818 L1072.95,435.818 A4,4 0 0 0 1068.95,439.818" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1554.633,435.818 L1554.633,443.818 A2,2 0 0 0 1556.633,445.818 L1564.633,445.818 L1554.633,435.818" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><text x="1074.95" y="455.32" fill="#000" font-size="15" textLength="349.922">L'ancienne révision ne redevient pas modifiable.</text><text x="1074.95" y="472.986" fill="#000" font-size="15" textLength="329.297">La nouvelle copie complète garde sa filiation.</text><text x="1074.95" y="490.652" fill="#000" font-size="15" textLength="372.949">Repointage limité aux usages explicitement choisis</text><text x="1074.95" y="508.318" fill="#000" font-size="15" textLength="385.122">d'une VersionActe modifiable, avec carte des nœuds.</text><text x="1074.95" y="525.984" fill="#000" font-size="15" textLength="474.683">Aucun appui, examen ou consentement hérité automatiquement.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="34"><path d="M513.36,599.148 L513.36,707.144 A4,4 0 0 0 517.36,711.144 L1018.234,711.144 A4,4 0 0 0 1022.234,707.144 L1022.234,605.148 L1012.234,595.148 L771.79,595.148 L767.79,530.518 L763.79,595.148 L517.36,595.148 A4,4 0 0 0 513.36,599.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1012.234,595.148 L1012.234,603.148 A2,2 0 0 0 1014.234,605.148 L1022.234,605.148 L1012.234,595.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><text x="519.36" y="614.65" fill="#000" font-size="15" textLength="369.155">Une UtilisationPreuve désigne UNE révision exacte.</text><text x="519.36" y="632.316" fill="#000" font-size="15" textLength="469.702">Chaque SelectionPreuve vise des nœuds de cette même révision.</text><text x="519.36" y="649.982" fill="#000" font-size="15" textLength="457.083">Une révision peut être réutilisée par plusieurs versions d'actes.</text><text x="519.36" y="667.648" fill="#000" font-size="15" textLength="487.874">Le gel protège aussi ses états sources et ses chemins sélectionnés.</text><text x="519.36" y="685.314" fill="#000" font-size="15" textLength="483.362">Les liens rédactionnels externes conservent la version cible exacte</text><text x="519.36" y="702.98" fill="#000" font-size="15" textLength="449.839">et, via ses usages, les révisions probatoires pertinentes (CF2).</text></g><!--link *start* to B--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="11" data-link-type="dependency"><path d="M767.79,63.858 C767.79,87.188 767.79,144.328 767.79,190.138" style="stroke:#334155;stroke-width:1;" fill="none" id="*start*-to-B"/><polygon points="767.79,195.138,771.79,186.138,767.79,190.138,763.79,186.138,767.79,195.138" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="768.79" y="108.99" fill="#000" font-size="15" textLength="36.672">créer</text><text x="805.462" y="108.99" fill="#000" font-size="15"> </text><text x="810.208" y="108.99" fill="#000" font-size="15" textLength="12.62">la</text><text x="822.828" y="108.99" fill="#000" font-size="15"> </text><text x="827.574" y="108.99" fill="#000" font-size="15" textLength="65.127">première</text><text x="892.701" y="108.99" fill="#000" font-size="15"> </text><text x="897.447" y="108.99" fill="#000" font-size="15" textLength="57.1">révision</text><text x="954.547" y="108.99" fill="#000" font-size="15"> </text><text x="959.293" y="108.99" fill="#000" font-size="15" textLength="18.523">ou</text><text x="826.952" y="126.656" fill="#000" font-size="15" textLength="26.975">une</text><text x="853.927" y="126.656" fill="#000" font-size="15"> </text><text x="858.673" y="126.656" fill="#000" font-size="15" textLength="60.981">nouvelle</text><text x="778.008" y="144.322" fill="#000" font-size="15" textLength="53.093">[Preuve</text><text x="831.101" y="144.322" fill="#000" font-size="15"> </text><text x="835.847" y="144.322" fill="#000" font-size="15" textLength="55.305">durable</text><text x="891.152" y="144.322" fill="#000" font-size="15"> </text><text x="895.898" y="144.322" fill="#000" font-size="15" textLength="72.7">identifiée,</text><text x="781.889" y="161.988" fill="#000" font-size="15" textLength="51.042">origine</text><text x="832.932" y="161.988" fill="#000" font-size="15"> </text><text x="837.678" y="161.988" fill="#000" font-size="15" textLength="61.655">explicite</text><text x="899.333" y="161.988" fill="#000" font-size="15"> </text><text x="904.079" y="161.988" fill="#000" font-size="15" textLength="11.982">si</text><text x="916.062" y="161.988" fill="#000" font-size="15"> </text><text x="920.808" y="161.988" fill="#000" font-size="15" textLength="43.909">copie]</text></g><!--link B to I--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="15" data-link-type="dependency"><path d="M767.79,304.188 C767.79,345.088 767.79,395.808 767.79,434.328" style="stroke:#334155;stroke-width:1;" fill="none" id="B-to-I"/><polygon points="767.79,439.328,771.79,430.328,767.79,434.328,763.79,430.328,767.79,439.328" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="768.79" y="349.32" fill="#000" font-size="15" textLength="58.257">finaliser</text><text x="827.047" y="349.32" fill="#000" font-size="15"> </text><text x="831.793" y="349.32" fill="#000" font-size="15" textLength="12.693">le</text><text x="844.486" y="349.32" fill="#000" font-size="15"> </text><text x="849.232" y="349.32" fill="#000" font-size="15" textLength="22.046">gel</text><text x="871.278" y="349.32" fill="#000" font-size="15"> </text><text x="876.024" y="349.32" fill="#000" font-size="15" textLength="39.851">d'une</text><text x="915.875" y="349.32" fill="#000" font-size="15"> </text><text x="920.621" y="349.32" fill="#000" font-size="15" textLength="86.807">VersionActe</text><text x="850.118" y="366.986" fill="#000" font-size="15" textLength="75.981">utilisatrice</text><text x="793.949" y="384.652" fill="#000" font-size="15" textLength="61.978">[révision</text><text x="855.926" y="384.652" fill="#000" font-size="15"> </text><text x="860.672" y="384.652" fill="#000" font-size="15" textLength="47.49">exacte</text><text x="908.163" y="384.652" fill="#000" font-size="15"> </text><text x="912.909" y="384.652" fill="#000" font-size="15" textLength="13.967">et</text><text x="926.876" y="384.652" fill="#000" font-size="15"> </text><text x="931.622" y="384.652" fill="#000" font-size="15" textLength="50.647">clôture</text><text x="797.468" y="402.318" fill="#000" font-size="15" textLength="80.471">conservées</text><text x="877.939" y="402.318" fill="#000" font-size="15"> </text><text x="882.685" y="402.318" fill="#000" font-size="15" textLength="13.967">et</text><text x="896.653" y="402.318" fill="#000" font-size="15"> </text><text x="901.399" y="402.318" fill="#000" font-size="15" textLength="77.351">protégées]</text></g><g class="legend" data-source-line="41"><rect x="404.14" y="732.144" width="764.353" height="75.953" fill="none" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><text x="409.14" y="750.68" fill="#000" font-size="14" textLength="663.831">« Copier la preuve entière » = copier l'arbre complet d'une révision sous l'identité durable Preuve.</text><text x="409.14" y="767.168" fill="#000" font-size="14" textLength="754.353">Les sources Email/PDF restent originales; leurs états utilisés sont conservés, sans duplication fictive de source.</text><text x="409.14" y="783.656" fill="#000" font-size="14" textLength="584.302">Immutabilité des décisions ExamenEditorial (L1-A) distincte de ce gel de révision (L5).</text><text x="409.14" y="800.144" fill="#000" font-size="14" textLength="716.516">Mono-utilisateur : contrôles contre onglets, tâches et reprises concurrentes; aucun workflow collaboratif.</text></g><g class="caption" data-source-line="3"><text x="460.136" y="835.633" fill="#000" font-size="14" textLength="652.36">C-TRANS-2026-10-21-R1 • identité Preuve durable, révisions distinctes • UC03 / 04 / 07 / 11</text></g><?plantuml-src VLRBRjj65DtpAsxJXPD2aYsdSO44AI2hCc10SGB7wYRnOaIEf6c6GtOUIhBhFxHVa5MKRhFhBaH_f5_ISsT8YQc1RlJWtEUvvzpXDyhaEXIId7-lvKY5KcTUUIrfOlEDyZBtmKgQqZ-__K7JzpaEYgDW9DbcjrLELGR_XLt21a5gAyDMPhceFPzCXpVNawkNmzEJqxFX-6HuEXvUZn7f0wb26gHfTlGYkb0Hh5XgEJZ4TLGevr6UboxwBAOd3-cOJhxdZn_mCHvdxeqojR2YHFt2otEHlrdRAfXYMkdAqhUpYukpYuixPfKjf6rDJX-TFPoTPnkKHBAi_NiqudAhOWjP5XtetldryyNbVFxywhKvT5vMXLefhfjS5HpbbIaKkxbx91oTTywNpvujRYRdyrdVMPgrM3Sxj2xGQp2qbZgwNMRPg-zkQJZyaSxfCULmaPQqO7HBrNoqVV2hG3mDKm54hULhy-fhG5kaLmf11bHPjLOmb-zghN9Cbvn2rRMIjnddQdQe7ybUYP2Zek34ccCRojLIOrXYjG8XcjqjqBSIxNhRVDPS7MOa-TzEkXX916_nB4PmUpy7lxOVhdgokBcUKHyI7_kB4G07wiatLK3YOu9v7PPQmJKM5q5ODJihJIvf0wgWkLy3h8JrYh505CRm4h5MoWYjN2mq1auS_bbQpZi1nIXu1GlXhSePnLvHxmIVIq-vRZv7DQ1nnDfoi_oyjXLwurcwsupJmJc5Gy9skZ8XybNAuouGp7BfVN-kAMkCbbW6c__5RazGrY78KZQVIjcgAyjCXUXQhZnLA_2IQ0w6AB66963bWlAqkEg56m16HxuAFWPBOKRmQzdrjAVWbcbFQ3mQNVNqo-RN-_gUKjeIJfMrPWZvom_80KFpz--XY51g6QphJpP6UIc3Tf5ZBEuQts0UonICMGdZez4aKhP4em6e7ocp9uTH8AlPLYfIjDjIOEKlwA_PZJ9f2cA44apGo2RYTCau7GcJAsc-sdZyHnPoY-S-0dLO15p9NEprcCILkcq-8lXQM5ws0fJKIl2kY339kbB6izgqAYEg8hphrBDNQydve0XKuU1rbyI7EWOajZAd76AG4Qc4yG4eKTT13PXdYCfh97BHj4asmAujmrSbweIo-E2_M2qhZ_CEh0NAMRGwGadT9eBkrPgFhcPt6Cu5JJU2XVjIQYo9Wn_i-gKphvDA4hNtaKPjvaFeMWPFpIUVDcMI8czQh0QgTN0gicoRW7DyWV4bCqgouFKG5VrnpQ9rs93CqMQ7NUvupziyoPwVvXkiP8H0-BPuWsvJ930M18biBaGwavgdYGrhfDkB7t13OcqrSTFAJlv4B96j4Z5PeiCW2g5tJQBOfV2LudrRIom_msDqT7zwSVgWDp0jr_mxZGoXl_n9KsPdTxSmvjq6fYz_GR5vUznUyArcxxm0nBjF7ztP2BsrmMXqqCrAeVJnYvyk82BdkVrqBGdqzQJT02tQtUZOcQdVxLs0u7Yl5e6L4Sa6GG7ZRNmDIPauxsLP1Y-MY1BhGdQmCM-1cqNkpt3beG2XwVvyF9myEBns9CQb-wBVx_tvemSS_5bbgc5tR_3MUKpxAz6bdnARQWtCKB1lFe0jaJbMrbQvP9C7Q-EydgHxZTvMzirALszngBLOLXRjhU8Oqm3_1G00?></g></svg>