<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1410px;height:828px;background:#FFFFFF;" width="1410px" height="828px" viewBox="0 0 1410 828" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="551.719" y="23.535" fill="#000" font-size="14" textLength="299.94" font-weight="700">Architecture C — Cycle d'une VersionActe</text></g><g class="entity" data-qualified-name="B" id="ent0001" data-source-line="8"><rect x="441.74" y="181.328" width="487.285" height="90.664" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="4" ry="4"/><line x1="441.74" y1="226.66" x2="929.025" y2="226.66" style="stroke:#2563EB;stroke-width:0.5;"/><text x="617.996" y="200.83" fill="#000" font-size="15" textLength="83.21">BROUILLON</text><text x="617.996" y="218.496" fill="#000" font-size="15" textLength="134.773">version modifiable</text><text x="446.74" y="246.162" fill="#000" font-size="15" textLength="467.285">éditer / sélectionner / préparer un candidat [entrées contrôlées]</text><text x="446.74" y="263.828" fill="#000" font-size="15" textLength="420.154">gel refusé / rester BROUILLON, aucun contenu figé partiel</text></g><g class="entity" data-qualified-name="F" id="ent0002" data-source-line="9"><rect x="422.26" y="407.818" width="526.243" height="108.33" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.5;" rx="4" ry="4"/><line x1="422.26" y1="453.15" x2="948.503" y2="453.15" style="stroke:#2563EB;stroke-width:0.5;"/><text x="567.897" y="427.32" fill="#000" font-size="15" textLength="39.463">FIGEE</text><text x="567.897" y="444.986" fill="#000" font-size="15" textLength="234.968">contenu et références conservés</text><text x="427.26" y="472.652" fill="#000" font-size="15" textLength="297.275">consulter / restituer les octets conservés</text><text x="427.26" y="490.318" fill="#000" font-size="15" textLength="475.313">événement attesté / ajouter une trace séparée, contenu inchangé</text><text x="427.26" y="507.984" fill="#000" font-size="15" textLength="506.243">demande de modification / créer UNE AUTRE VersionActe BROUILLON</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="11"><ellipse cx="685.38" cy="53.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M6,181.488 L6,271.818 A4,4 0 0 0 10,275.818 L402.768,275.818 A4,4 0 0 0 406.768,271.818 L406.768,230.658 L441.31,226.658 L406.768,222.658 L406.768,187.488 L396.768,177.488 L10,177.488 A4,4 0 0 0 6,181.488" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><path d="M396.768,177.488 L396.768,185.488 A2,2 0 0 0 398.768,187.488 L406.768,187.488 L396.768,177.488" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><text x="12" y="196.99" fill="#000" font-size="15" textLength="253.711">Une Cause contient plusieurs Acte.</text><text x="12" y="214.656" fill="#000" font-size="15" textLength="288.186">Un Acte contient plusieurs VersionActe.</text><text x="12" y="232.322" fill="#000" font-size="15" textLength="379.768">Chaque version a son Document PRODUCED propre.</text><text x="12" y="249.988" fill="#000" font-size="15" textLength="338.987">L'origine d'une nouvelle version est conservée.</text><text x="12" y="267.654" fill="#000" font-size="15" textLength="375.425">R06 : parcours / brouillons actifs encore à préciser.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="27"><path d="M983.39,416.818 L983.39,457.988 L948.7,461.988 L983.39,465.988 L983.39,507.148 A4,4 0 0 0 987.39,511.148 L1391.379,511.148 A4,4 0 0 0 1395.379,507.148 L1395.379,422.818 L1385.379,412.818 L987.39,412.818 A4,4 0 0 0 983.39,416.818" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><path d="M1385.379,412.818 L1385.379,420.818 A2,2 0 0 0 1387.379,422.818 L1395.379,422.818 L1385.379,412.818" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><text x="989.39" y="432.32" fill="#000" font-size="15" textLength="342.986">Cette instance ne redevient jamais BROUILLON.</text><text x="989.39" y="449.986" fill="#000" font-size="15" textLength="356.433">Nouveau brouillon = nouvelle identité, nouveaux</text><text x="989.39" y="467.652" fill="#000" font-size="15" textLength="388.967">textes privés PRODUCED et choix d'usages explicites.</text><text x="989.39" y="485.318" fill="#000" font-size="15" textLength="390.989">Les révisions de preuve inchangées sont réutilisables;</text><text x="989.39" y="502.984" fill="#000" font-size="15" textLength="332.556">leur modification exige une nouvelle révision.</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="34"><path d="M455.46,581.148 L455.46,689.144 A4,4 0 0 0 459.46,693.144 L911.305,693.144 A4,4 0 0 0 915.305,689.144 L915.305,587.148 L905.305,577.148 L689.38,577.148 L685.38,516.208 L681.38,577.148 L459.46,577.148 A4,4 0 0 0 455.46,581.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><path d="M905.305,577.148 L905.305,585.148 A2,2 0 0 0 907.305,587.148 L915.305,587.148 L905.305,577.148" style="stroke:#D97706;stroke-width:0.5;" fill="#FFFBEB"/><text x="461.46" y="596.65" fill="#000" font-size="15" textLength="423.743">Gel : textes, positions, examens, liens, usages, sélections,</text><text x="461.46" y="614.316" fill="#000" font-size="15" textLength="412.332">révisions exactes de preuve et dépendances pertinentes,</text><text x="461.46" y="631.982" fill="#000" font-size="15" textLength="372.041">états sources/citations, parents, cotes/sous-cotes,</text><text x="461.46" y="649.648" fill="#000" font-size="15" textLength="340.518">ResultatVersion et livrables réellement utilisés.</text><text x="461.46" y="667.314" fill="#000" font-size="15" textLength="332.981">Échec de finalisation : pas d'état FIGEE publié.</text><text x="461.46" y="684.98" fill="#000" font-size="15" textLength="438.845">Un candidat technique orphelin peut rester à nettoyer (R08).</text></g><!--link *start* to B--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="11" data-link-type="dependency"><path d="M685.38,63.938 C685.38,85.808 685.38,136.078 685.38,175.918" style="stroke:#334155;stroke-width:1;" fill="none" id="*start*-to-B"/><polygon points="685.38,180.918,689.38,171.918,685.38,175.918,681.38,171.918,685.38,180.918" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="686.38" y="108.99" fill="#000" font-size="15" textLength="36.672">créer</text><text x="723.052" y="108.99" fill="#000" font-size="15"> </text><text x="727.798" y="108.99" fill="#000" font-size="15" textLength="26.975">une</text><text x="754.774" y="108.99" fill="#000" font-size="15"> </text><text x="759.52" y="108.99" fill="#000" font-size="15" textLength="52.764">version</text><text x="812.283" y="108.99" fill="#000" font-size="15"> </text><text x="817.029" y="108.99" fill="#000" font-size="15" textLength="33.816">sous</text><text x="850.845" y="108.99" fill="#000" font-size="15"> </text><text x="855.591" y="108.99" fill="#000" font-size="15" textLength="18.618">un</text><text x="874.21" y="108.99" fill="#000" font-size="15"> </text><text x="878.956" y="108.99" fill="#000" font-size="15" textLength="32">Acte</text><text x="756.725" y="126.656" fill="#000" font-size="15" textLength="17.798">de</text><text x="774.523" y="126.656" fill="#000" font-size="15"> </text><text x="779.269" y="126.656" fill="#000" font-size="15" textLength="12.62">la</text><text x="791.889" y="126.656" fill="#000" font-size="15"> </text><text x="796.635" y="126.656" fill="#000" font-size="15" textLength="43.975">Cause</text><text x="692.151" y="144.322" fill="#000" font-size="15" textLength="68.218">[contexte</text><text x="760.369" y="144.322" fill="#000" font-size="15"> </text><text x="765.115" y="144.322" fill="#000" font-size="15" textLength="13.967">et</text><text x="779.083" y="144.322" fill="#000" font-size="15"> </text><text x="783.829" y="144.322" fill="#000" font-size="15" textLength="55.356">identité</text><text x="839.185" y="144.322" fill="#000" font-size="15"> </text><text x="843.931" y="144.322" fill="#000" font-size="15" textLength="61.252">propres]</text></g><!--link B to F--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="14" data-link-type="dependency"><path d="M685.38,272.368 C685.38,310.878 685.38,361.538 685.38,402.418" style="stroke:#334155;stroke-width:1;" fill="none" id="B-to-F"/><polygon points="685.38,407.418,689.38,398.418,685.38,402.418,681.38,398.418,685.38,407.418" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="713.571" y="321.32" fill="#000" font-size="15" textLength="58.257">finaliser</text><text x="771.828" y="321.32" fill="#000" font-size="15"> </text><text x="776.574" y="321.32" fill="#000" font-size="15" textLength="12.693">le</text><text x="789.267" y="321.32" fill="#000" font-size="15"> </text><text x="794.013" y="321.32" fill="#000" font-size="15" textLength="22.046">gel</text><text x="816.059" y="321.32" fill="#000" font-size="15"> </text><text x="820.805" y="321.32" fill="#000" font-size="15" textLength="67.266">[candidat</text><text x="709.393" y="338.986" fill="#000" font-size="15" textLength="63.391">complet,</text><text x="772.784" y="338.986" fill="#000" font-size="15"> </text><text x="777.53" y="338.986" fill="#000" font-size="15" textLength="53.774">entrées</text><text x="831.304" y="338.986" fill="#000" font-size="15"> </text><text x="836.05" y="338.986" fill="#000" font-size="15" textLength="56.199">stables]</text><text x="686.38" y="356.652" fill="#000" font-size="15" textLength="60.959">capturer</text><text x="747.339" y="356.652" fill="#000" font-size="15"> </text><text x="752.086" y="356.652" fill="#000" font-size="15" textLength="63.149">l'agrégat</text><text x="815.235" y="356.652" fill="#000" font-size="15"> </text><text x="819.981" y="356.652" fill="#000" font-size="15" textLength="13.967">et</text><text x="833.948" y="356.652" fill="#000" font-size="15"> </text><text x="838.694" y="356.652" fill="#000" font-size="15" textLength="48.171">activer</text><text x="886.866" y="356.652" fill="#000" font-size="15"> </text><text x="891.612" y="356.652" fill="#000" font-size="15" textLength="23.65">ses</text><text x="759.542" y="374.318" fill="#000" font-size="15" textLength="82.559">protections</text></g><g class="legend" data-source-line="41"><rect x="352.804" y="714.144" width="697.771" height="75.953" fill="none" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><text x="357.804" y="732.68" fill="#000" font-size="14" textLength="443.536">Les événements sont cumulatifs et extérieurs à l'état du contenu.</text><text x="357.804" y="749.168" fill="#000" font-size="14" textLength="528.5">Aucun état exclusif DEPOSEE ou COMMUNIQUEE; aucun envoi implicite au gel.</text><text x="357.804" y="765.656" fill="#000" font-size="14" textLength="687.771">Un seul utilisateur humain; verrous et idempotence couvrent les opérations techniques concurrentes.</text><text x="357.804" y="782.144" fill="#000" font-size="14" textLength="613.635">Modèle proposé : aucune garantie L5 ni approbation des dossiers locaux n'est attestée ici.</text></g><g class="caption" data-source-line="3"><text x="423.491" y="817.633" fill="#000" font-size="14" textLength="556.397">C-TRANS-2026-10-21-R1 • contrat cible documentaire • UC01A / 01B / 11 / 19</text></g><?plantuml-src RLNBSYD54BpFLnJBmK18jcLY7M07H4YojE48FnRjQY-s3-sUbjIxhUwX7mhvnfKx7q1mGdV-OFw4Bo6hP_HOu6AtPgghAhCoQxxGLffKAWhnnQXZdPQcY3eQHNql5peg6PDNDAI_V_cDXYyIBygZP1LzK3veP_iogaAAAk9Cm-xxIV_kNVVizEoyspljdlMwanvk_a7IsUX59AcVEOEJQQbi51gf-VLqUDhhqmcTzWRus-lnd--By4dRIdYnH7CYge6Gd