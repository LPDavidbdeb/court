<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:544px;height:1164px;background:#FFFFFF;" width="544px" height="1164px" viewBox="0 0 544 1164" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="116.462" y="30.78" fill="#000" font-size="14" textLength="309.825" font-weight="700" font-family="Helvetica">Rendu d'un paragraphe et calcul du bordereau</text></g><ellipse cx="255.447" cy="60" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="151.917" y="90" width="207.061" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.917" y="109.24" fill="#000" font-size="12" textLength="187.061" font-family="Helvetica">Paragraphe (LibraryNode de l'acte)</text><rect x="154.39" y="142" width="202.115" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="164.39" y="161.24" fill="#000" font-size="12" textLength="182.115" font-family="Helvetica">Lien paragraphe → démonstration</text><text x="164.39" y="173.24" fill="#000" font-size="12" textLength="166.389" font-family="Helvetica">(portée, état, mode d'affichage)</text><rect x="127.24" y="206" width="256.414" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.24" y="225.24" fill="#000" font-size="12" textLength="236.414" font-family="Helvetica">Démonstration → ses poignées, dans l'ordre</text><rect x="130.366" y="258" width="250.162" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.366" y="277.24" fill="#000" font-size="12" textLength="230.162" font-family="Helvetica">Chaque poignée → un nœud, à tout niveau</text><rect x="151.105" y="310" width="208.684" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="161.105" y="329.24" fill="#000" font-size="12" textLength="188.684" font-family="Helvetica">Descendre l'arbre jusqu'aux feuilles</text><text x="161.105" y="341.24" fill="#000" font-size="12" textLength="176.725" font-family="Helvetica">(et suivre les renvois, sans cycle)</text><rect x="123.713" y="374" width="263.469" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="133.713" y="393.24" fill="#000" font-size="12" textLength="179.42" font-family="Helvetica">Les feuilles → éléments de la rive</text><text x="133.713" y="405.24" fill="#000" font-size="12" textLength="243.469" font-family="Helvetica">(phrase citée, événement, énoncé adverse…)</text><rect x="144.71" y="486" width="221.475" height="32" fill="#FDD" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="154.71" y="505.24" fill="#000" font-size="12" textLength="201.475" font-family="Helvetica">Signalé : ne se rend pas dans un acte</text><ellipse cx="255.447" cy="558.5" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="255.447" cy="558.5" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="182.255,438,328.639,438,340.639,450,328.639,462,182.255,462,170.255,450,182.255,438" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="259.447" y="470.47" fill="#000" font-size="11" textLength="18.353" font-family="Helvetica">non</text><text x="182.255" y="452.97" fill="#000" font-size="11" textLength="146.384" font-family="Helvetica">Élément certifié sur l'original ?</text><text x="340.639" y="447.47" fill="#000" font-size="11" textLength="14.679" font-family="Helvetica">oui</text><rect x="161.738" y="611.5" width="187.418" height="68" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="171.738" y="630.74" fill="#000" font-size="12" textLength="138.07" font-family="Helvetica">Élément → son document</text><text x="171.738" y="642.74" fill="#000" font-size="12" textLength="128.713" font-family="Helvetica">(la citation → le courriel,</text><text x="171.738" y="654.74" fill="#000" font-size="12" textLength="167.418" font-family="Helvetica">❓ le message → la séquence,</text><text x="171.738" y="666.74" fill="#000" font-size="12" textLength="149.031" font-family="Helvetica">❓ la photo → l'événement)</text><rect x="16" y="699.5" width="480.895" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="28" y="725.5" width="238.813" height="80" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38" y="744.74" fill="#000" font-size="12" textLength="134.08" font-family="Helvetica">Bordereau de la version :</text><text x="38" y="756.74" fill="#000" font-size="12" textLength="154.752" font-family="Helvetica">- brouillon : calculé à la volée</text><text x="44.668" y="768.74" fill="#000" font-size="12" textLength="150.732" font-family="Helvetica">(tous les documents utilisés,</text><text x="44.668" y="780.74" fill="#000" font-size="12" textLength="212.145" font-family="Helvetica">ordre chronologique : get_exhibit_date),</text><text x="38" y="792.74" fill="#000" font-size="12" textLength="202.799" font-family="Helvetica">- déposée : lu dans les entrées gelées</text><rect x="62.362" y="840.5" width="170.088" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="72.362" y="859.74" fill="#000" font-size="12" textLength="101.396" font-family="Helvetica">Cote du document,</text><text x="72.362" y="871.74" fill="#000" font-size="12" textLength="150.088" font-family="Helvetica">sous-cote de la phrase citée</text><rect x="294.813" y="777" width="188.082" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="304.813" y="796.24" fill="#000" font-size="12" textLength="150.744" font-family="Helvetica">Verbatim : la phrase entière,</text><text x="304.813" y="808.24" fill="#000" font-size="12" textLength="127.043" font-family="Helvetica">rendue depuis l'élément</text><text x="304.813" y="820.24" fill="#000" font-size="12" textLength="168.082" font-family="Helvetica">(jamais tapée, jamais tronquée)</text><rect x="16" y="904.5" width="480.895" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><polygon points="209.143,930.5,301.751,930.5,313.751,942.5,301.751,954.5,209.143,954.5,197.143,942.5,209.143,930.5" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="209.143" y="945.47" fill="#000" font-size="11" textLength="92.608" font-family="Helvetica">Mode d'affichage ?</text><text x="153.116" y="939.97" fill="#000" font-size="11" textLength="44.027" font-family="Helvetica">exhaustif</text><text x="313.751" y="939.97" fill="#000" font-size="11" textLength="55.027" font-family="Helvetica">notamment</text><rect x="45.184" y="964.5" width="170.744" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="55.184" y="983.74" fill="#000" font-size="12" textLength="150.744" font-family="Helvetica">Toutes les cotes des feuilles</text><rect x="235.928" y="964.5" width="288.822" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="245.928" y="983.74" fill="#000" font-size="12" textLength="164.754" font-family="Helvetica">Les cotes des feuilles choisies,</text><text x="245.928" y="995.74" fill="#000" font-size="12" textLength="268.822" font-family="Helvetica">le bordereau reçoit quand même toutes les feuilles</text><polygon points="255.447,1014.5,267.447,1026.5,255.447,1038.5,243.447,1026.5,255.447,1014.5" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="110.562" y="1058.5" width="289.771" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="120.562" y="1077.74" fill="#000" font-size="12" textLength="103.406" font-family="Helvetica">Paragraphe rendu :</text><text x="120.562" y="1089.74" fill="#000" font-size="12" textLength="269.771" font-family="Helvetica">texte + verbatim + « tel qu'il appert des pièces … »</text><ellipse cx="255.447" cy="1133.5" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="255.447" cy="1133.5" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="255.447" y1="70" x2="255.447" y2="90" style="stroke:#181818;stroke-width:1;"/><polygon points="251.447,80,255.447,90,259.447,80,255.447,84" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="255.447" y1="122" x2="255.447" y2="142" style="stroke:#181818;stroke-width:1;"/><polygon points="251.447,132,255.447,142,259.447,132,255.447,136" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="255.447" y1="186" x2="255.447" y2="206" style="stroke:#181818;stroke-width:1;"/><polygon points="251.447,196,255.447,206,259.447,196,255.447,200" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="255.447" y1="238" x2="255.447" y2="258" style="stroke:#181818;stroke-width:1;"/><polygon points="251.447,248,255.447,258,259.447,248,255.447,252" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="255.447" y1="290" x2="255.447" y2="310" style="stroke:#181818;stroke-width:1;"/><polygon points="251.447,300,255.447,310,259.447,300,255.447,304" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="255.447" y1="354" x2="255.447" y2="374" style="stroke:#181818;stroke-width:1;"/><polygon points="251.447,364,255.447,374,259.447,364,255.447,368" fill="#181818" style="stroke:#181818;stroke-width:1;strok