<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1298px;height:745px;background:#FFFFFF;" width="1298px" height="745px" viewBox="0 0 1298 745" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="490.546" y="30.78" fill="#000" font-size="14" textLength="315.848" font-weight="700" font-family="Helvetica">US-C-02 — Structurer et numéroter la rédaction</text></g><rect x="20" y="51.49" width="1251.939" height="13" fill="none" style="stroke:none;"/><ellipse cx="168.977" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="39.749" y="109.49" width="258.456" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="49.749" y="129.5" fill="#172B4D" font-size="13" textLength="238.456" font-family="Helvetica">Choisir le profil de rédaction de la version</text><rect x="26" y="162.49" width="285.954" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="182.5" fill="#172B4D" font-size="13" textLength="265.954" font-family="Helvetica">Créer ou déplacer un groupe, une proposition,</text><text x="36" y="195.5" fill="#172B4D" font-size="13" textLength="177.062" font-family="Helvetica">une réserve ou une conclusion</text><path d="M300.501,629.49 L300.501,643.49 L280.501,647.49 L300.501,651.49 L300.501,665.49 A0,0 0 0 0 300.501,665.49 L547.649,665.49 A0,0 0 0 0 547.649,665.49 L547.649,639.49 L537.649,629.49 L300.501,629.49 A0,0 0 0 0 300.501,629.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M537.649,629.49 L537.649,639.49 L547.649,639.49 L537.649,629.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="306.501" y="644.5" fill="#000" font-size="13" textLength="195.819" font-family="Helvetica">Un numéro de travail ne remplace</text><text x="306.501" y="657.5" fill="#000" font-size="13" textLength="226.148" font-family="Helvetica">jamais le numéro imprimé d’un original.</text><rect x="57.453" y="624.49" width="223.049" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="67.453" y="644.5" fill="#172B4D" font-size="13" textLength="154.642" font-family="Helvetica">Lire des repères cohérents</text><text x="67.453" y="657.5" fill="#172B4D" font-size="13" textLength="203.049" font-family="Helvetica">dans la vue complète et les extraits</text><ellipse cx="168.977" cy="701.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="168.977" cy="701.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="712.49" style="stroke:#000;stroke-width:1.5;"/><path d="M1016.795,226.99 L1016.795,247.49 L996.795,251.49 L1016.795,255.49 L1016.795,275.99 A0,0 0 0 0 1016.795,275.99 L1266.133,275.99 A0,0 0 0 0 1266.133,275.99 L1266.133,236.99 L1256.133,226.99 L1016.795,226.99 A0,0 0 0 0 1016.795,226.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1256.133,226.99 L1256.133,236.99 L1266.133,236.99 L1256.133,226.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="1022.795" y="242" fill="#000" font-size="13" textLength="160.412" font-family="Helvetica">La structure, le rôle éditorial</text><text x="1022.795" y="255" fill="#000" font-size="13" textLength="182.102" font-family="Helvetica">et la présentation sont distincts.</text><text x="1022.795" y="268" fill="#000" font-size="13" textLength="228.338" font-family="Helvetica">Observation / Réfutation reste facultatif.</text><rect x="726.037" y="228.49" width="270.758" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="736.037" y="248.5" fill="#172B4D" font-size="13" textLength="221.121" font-family="Helvetica">Conserver une identité par occurrence</text><text x="736.037" y="261.5" fill="#172B4D" font-size="13" textLength="250.758" font-family="Helvetica">distincte du Statement et du numéro affiché</text><polygon points="755.556,295.99,967.276,295.99,979.276,307.99,967.276,319.99,755.556,319.99,743.556,307.99,755.556,295.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="755.556" y="311.5" fill="#172B4D" font-size="13" textLength="211.72" font-family="Helvetica">Nouveau profil activé explicitement ?</text><text x="726.208" y="305" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="979.276" y="305" fill="#000" font-size="13" textLength="32.519" font-family="Helvetica">hérité</text><rect x="558.649" y="329.99" width="290.251" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="568.649" y="350" fill="#172B4D" font-size="13" textLength="179.924" font-family="Helvetica">Résoudre le compteur principal</text><text x="568.649" y="363" fill="#172B4D" font-size="13" textLength="270.251" font-family="Helvetica">sur le Document complet, à toutes profondeurs</text><rect x="868.901" y="329.99" width="300.313" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="878.901" y="350" fill="#172B4D" font-size="13" textLength="280.313" font-family="Helvetica">Appliquer le régime LEGACY / AUTO / STORED</text><text x="878.901" y="363" fill="#172B4D" font-size="13" textLength="192.232" font-family="Helvetica">déjà applicable sans le requalifier</text><polygon points="861.416,381.99,873.416,393.99,861.416,405.99,849.416,393.99,861.416,381.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="727.853" y="425.99" width="267.127" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="737.853" y="446" fill="#172B4D" font-size="13" tex