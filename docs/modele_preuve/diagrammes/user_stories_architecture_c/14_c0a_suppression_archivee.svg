<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1367px;height:1042px;background:#FFFFFF;" width="1367px" height="1042px" viewBox="0 0 1367 1042" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="459.221" y="30.78" fill="#000" font-size="14" textLength="446.612" font-weight="700" font-family="Helvetica">US-C-14 — Supprimer une occurrence sans perdre les traces utiles</text></g><rect x="20" y="51.49" width="1320.053" height="13" fill="none" style="stroke:none;"/><ellipse cx="167.152" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="27.777" y="109.49" width="278.75" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="37.777" y="129.5" fill="#172B4D" font-size="13" textLength="251.475" font-family="Helvetica">Demander la suppression d’une occurrence</text><text x="37.777" y="142.5" fill="#172B4D" font-size="13" textLength="258.75" font-family="Helvetica">et de ses descendants par ajax_delete_node</text><path d="M328.304,918.115 L328.304,938.615 L308.304,942.615 L328.304,946.615 L328.304,967.115 A0,0 0 0 0 328.304,967.115 L636.929,967.115 A0,0 0 0 0 636.929,967.115 L636.929,928.115 L626.929,918.115 L328.304,918.115 A0,0 0 0 0 328.304,918.115" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M626.929,918.115 L626.929,928.115 L636.929,928.115 L626.929,918.115" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="334.304" y="933.125" fill="#000" font-size="13" textLength="261.581" font-family="Helvetica">Captures utilisées et archives liées protégées</text><text x="334.304" y="946.125" fill="#000" font-size="13" textLength="244.943" font-family="Helvetica">contre les suppressions ORM concernées.</text><text x="334.304" y="959.125" fill="#000" font-size="13" textLength="287.625" font-family="Helvetica">Aucune immutabilité SQL globale n’est annoncée.</text><rect x="26" y="919.615" width="282.304" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="939.625" fill="#172B4D" font-size="13" textLength="262.304" font-family="Helvetica">Consulter les archives, captures et anciennes</text><text x="36" y="952.625" fill="#172B4D" font-size="13" textLength="246.435" font-family="Helvetica">décisions disponibles dans la concordance</text><ellipse cx="167.152" cy="998.115" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="167.152" cy="998.115" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="1009.115" style="stroke:#000;stroke-width:1.5;"/><rect x="834.838" y="175.49" width="212.931" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="844.838" y="195.5" fill="#172B4D" font-size="13" textLength="148.129" font-family="Helvetica">Précontrôler le bloc entier</text><text x="844.838" y="208.5" fill="#172B4D" font-size="13" textLength="192.931" font-family="Helvetica">avant de créer la moindre archive</text><path d="M1076.081,291.99 L1076.081,312.49 L1056.081,316.49 L1076.081,320.49 L1076.081,340.99 A0,0 0 0 0 1076.081,340.99 L1310.248,340.99 A0,0 0 0 0 1310.248,340.99 L1310.248,301.99 L1300.248,291.99 L1076.081,291.99 A0,0 0 0 0 1076.081,291.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1300.248,291.99 L1300.248,301.99 L1310.248,301.99 L1300.248,291.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="1082.081" y="307" fill="#000" font-size="13" textLength="199.437" font-family="Helvetica">Le schéma P6 ne sait pas archiver</text><text x="1082.081" y="320" fill="#000" font-size="13" textLength="176.306" font-family="Helvetica">ces confirmations et ancrages.</text><text x="1082.081" y="333" fill="#000" font-size="13" textLength="213.167" font-family="Helvetica">Refuser évite leur perte par cascade.</text><rect x="826.525" y="293.49" width="229.555" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="836.525" y="313.5" fill="#172B4D" font-size="13" textLength="205.931" font-family="Helvetica">Refuser tout le bloc avec HTTP 403</text><text x="836.525" y="326.5" fill="#172B4D" font-size="13" textLength="209.555" font-family="Helvetica">sans suppression ni archive partielle</text><ellipse cx="941.303" cy="372.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="941.303" cy="372.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="801.458,241.49,1081.148,241.49,1093.148,254.49,1081.148,267.49,801.458,267.49,789.458,254.49,801.458,241.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="945.303" y="277.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="801.458" y="251.5" fill="#172B4D" font-size="13" textLength="242.023" font-family="Helvetica">Un nœud est historique / REPRODUCED,</text><text x="801.458" y="264.5" fill="#172B4D" font-size="13" textLength="279.69" font-family="Helvetica">ou porte une confirmation d’appui / un ancrage ?</text><rect x="817.87" y="425.49" width="246.865" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="827.87" y="445.5" fill="#172B4D" font-size="13" textLength="226.865" font-family="Helvetica">Archiver les occurrences et leurs textes</text><rect x="803.763" y="478.49" width="275.081" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="813.763" y="498.5" fill="#172B4D" font-size="13" textLength="255.081" font-family="Helvetica">Repointer les extrémités de correspondance</text><text x="813.763" y="511.5" fill="#172B4D" font-size="13" textLength="219.661" font-family="Helvetica">vers les archives avant la suppression</text><rect x="822.199" y="544.49" width="238.207" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="832.199" y="564.5" fill="#172B4D" font-size="13" textLength="218.207" font-family="Helvetica">Supprimer les occurrences autorisées</text><polygon points="812.668,597.49,1069.938,597.49,1081.938,610.49,1069.938,623.49,812.668,623.49,800.668,610.49,812.668,597.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="812.668" y="607.5" fill="#172B4D" font-size="13" textLength="205.245" font-family="Helvetica">Statement encore partagé, protégé,</text><text x="812.668" y="620.5" fill="#172B4D" font-size="13" textLength="257.271" font-family="Helvetica">ou utile à des appuis / captures examinées ?</text><text x="783.32" y="607.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="1081.938" y="607.5" fill="#000" font-size="13" textLength="99.722" font-family="Helvetica">nettoyage permis</text><rect x="647.929" y="633.49" width="282.292" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="657.929" y="653.5" fill="#172B4D" font-size="13" textLength="262.292" font-family="Helvetica">Conserver le Statement et ses captures utiles</text><rect x="950.221" y="633.49" width="286.621" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="960.221" y="653.5" fill="#172B4D" font-size="13" textLength="266.621" font-family="Helvetica">Supprimer seulement les Statements inutilisés</text><text x="960.221" y="666.5" fill="#172B4D" font-size="13" textLength="187.891" font-family="Helvetica">dont le ContentType a été vérifié</text><polygon points="941.303,685.49,953.303,697.49,941.303,709.49,929.303,697.49,941.303,685.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="792.581" y="777.99" width="297.443" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="802.581" y="798" fill="#172B4D" font-size="13" textLength="158.266" font-family="Helvetica">Annuler toute la transaction</text><text x="802.581" y="811" fill="#172B4D" font-size="13" textLength="277.443" font-family="Helvetica">y compris archives et changements d’extrémités</text><ellipse cx="941.303" cy="866.615" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="941.303" cy="866.615" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="882.755,729.49,999.851,729.49,1011.851,741.49,999.851,753.49,882.755,753.49,870.755,741.49,882.755,729.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="945.303" y="763.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="882.755" y="745" fill="#172B4D" font-size="13" textLength="117.095" font-family="Helvetica">Une étape échoue ?</text><line x1="641.929" y1="51.49" x2="641.929" y2="1009.115" style="stroke:#000;stroke-width:1.5;"/><line x1="1339.248" y1="51.49" x2="1339.248" y2="1009.115" style="stroke:#000;stroke-width:1.5;"/><line x1="167.152" y1="89.49" x2="167.152" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="163.152,99.49,167.152,109.49,171.152,99.49,167.152,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="167.152" y1="965.615" x2="167.152" y2="987.115" style="stroke:#444;stroke-width:1;"/><polygon points="163.152,977.115,167.152,987.115,171.152,977.115,167.152,981.115" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="941.303" y1="339.49" x2="941.303" y2="361.49" style="stroke:#444;stroke-width:1;"/><polygon points="937.303,351.49,941.303,361.49,945.303,351.49,941