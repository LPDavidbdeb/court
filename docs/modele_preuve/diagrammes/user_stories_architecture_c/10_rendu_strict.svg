<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1550px;height:706px;background:#FFFFFF;" width="1550px" height="706px" viewBox="0 0 1550 706" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="624.803" y="30.78" fill="#000" font-size="14" textLength="298.71" font-weight="700" font-family="Helvetica">US-C-10 — Produire un rendu strict cohérent</text></g><rect x="20" y="51.49" width="1503.317" height="13" fill="none" style="stroke:none;"/><ellipse cx="153.079" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="55.298" y="109.49" width="195.563" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.298" y="129.5" fill="#172B4D" font-size="13" textLength="175.563" font-family="Helvetica">Choisir la version, le périmètre</text><text x="65.298" y="142.5" fill="#172B4D" font-size="13" textLength="127.188" font-family="Helvetica">et le livrable demandé</text><path d="M300.159,582.99 L300.159,603.49 L280.159,607.49 L300.159,611.49 L300.159,631.99 A0,0 0 0 0 300.159,631.99 L641.303,631.99 A0,0 0 0 0 641.303,631.99 L641.303,592.99 L631.303,582.99 L300.159,582.99 A0,0 0 0 0 300.159,582.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M631.303,582.99 L631.303,592.99 L641.303,592.99 L631.303,582.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="306.159" y="598" fill="#000" font-size="13" textLength="244.975" font-family="Helvetica">Un succès technique ne prouve ni la vérité</text><text x="306.159" y="611" fill="#000" font-size="13" textLength="266.678" font-family="Helvetica">d’une proposition ni la validité d’une inférence.</text><text x="306.159" y="624" fill="#000" font-size="13" textLength="320.144" font-family="Helvetica">Une vue diagnostique n’est pas un rendu strict accepté.</text><rect x="26" y="584.49" width="254.159" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="604.5" fill="#172B4D" font-size="13" textLength="187.859" font-family="Helvetica">Comparer les sorties cohérentes</text><text x="36" y="617.5" fill="#172B4D" font-size="13" textLength="234.159" font-family="Helvetica">et relire le contenu avant un éventuel gel</text><ellipse cx="153.079" cy="662.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="153.079" cy="662.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="673.99" style="stroke:#000;stroke-width:1.5;"/><rect x="804.008" y="175.49" width="305.429" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="814.008" y="195.5" fill="#172B4D" font-size="13" textLength="226.878" font-family="Helvetica">Construire un ResultatVersion commun</text><text x="814.008" y="208.5" fill="#172B4D" font-size="13" textLength="285.429" font-family="Helvetica">à partir du Document entier et des usages choisis</text><rect x="857.131" y="241.49" width="199.182" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="867.131" y="261.5" fill="#172B4D" font-size="13" textLength="179.182" font-family="Helvetica">Vérifier les sources, sélections,</text><text x="867.131" y="274.5" fill="#172B4D" font-size="13" textLength="174.865" font-family="Helvetica">certifications et dates requises</text><rect x="831.112" y="307.49" width="251.22" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="841.112" y="327.5" fill="#172B4D" font-size="13" textLength="231.22" font-family="Helvetica">Vérifier les examens éditoriaux courants</text><text x="841.112" y="340.5" fill="#172B4D" font-size="13" textLength="212.456" font-family="Helvetica">et la provenance de leurs manifestes</text><rect x="818.099" y="373.49" width="277.245" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="828.099" y="393.5" fill="#172B4D" font-size="13" textLength="226.173" font-family="Helvetica">Vérifier séparément les appuis retenus,</text><text x="828.099" y="406.5" fill="#172B4D" font-size="13" textLength="257.245" font-family="Helvetica">citations, liens, numéros et cotes applicables</text><polygon points="823.043,439.49,1090.4,439.49,1102.4,451.49,1090.4,463.49,823.043,463.49,811.043,451.49,823.043,439.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="823.043" y="455" fill="#172B4D" font-size="13" textLength="267.357" font-family="Helvetica">Tous les contrôles applicables sont satisfaits ?</text><text x="793.695" y="448.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="1102.4" y="448.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="652.303" y="473.49" width="297.481" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="662.303" y="493.5" fill="#172B4D" font-size="13" textLength="184.26" font-family="Helvetica">Rendre depuis le même résultat</text><text x="662.303" y="506.5" fill="#172B4D" font-size="13" textLength="277.481" font-family="Helvetica">le texte, les citations, les renvois et le bordereau</text><path d="M1242.846,473.49 L1242.846,493.99 L1222.846,497.99 L1242.846,501.99 L1242.846,522.49 A0,0 0 0 0 1242.846,522.49 L1517.511,522.49 A0,0 0 0 0 1517.511,522.49 L1517.511,483.49 L1507.511,473.49 L1242.846,473.49 A0,0 0 0 0 1242.846,473.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1507.511,473.49 L1507.511,483.49 L1517.511,483.49 L1507.511,473.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="1248.846" y="488.5" fill="#000" font-size="13" textLength="253.665" font-family="Helvetica">Aucun forçage d’une ancienne confirmation.</text><text x="1248.846" y="501.5" fill="#000" font-size="13" textLength="223.99" font-family="Helvetica">D05, D07, CF4 et la capacité PHRASE</text><text x="1248.846" y="514.5" fill="#000" font-size="13" textLength="252.922" font-family="Helvetica">bloquent seulement les chemins concernés.</text><rect x="1001.955" y="474.99" width="220.891" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1011.955" y="495" fill="#172B4D" font-size="13" textLength="200.148" font-family="Helvetica">Refuser le rendu strict et présenter</text><text x="1011.955" y="508" fill="#172B4D" font-size="13" textLength="200.891" font-family="Helvetica">la liste des diagnostics non résolus</text><ellipse cx="1112.4" cy="553.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1112.4" cy="553.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="646.303" y1="51.49" x2="646.303" y2="673.99" style="stroke:#000;stroke-width:1.5;"/><line x1="1522.511" y1="51.49" x2="1522.511" y2="673.99" style="stroke:#000;stroke-width:1.5;"/><line x1="153.079" y1="89.49" x2="153.079" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="149.079,99.49,153.079,109.49,157.079,99.49,153.079,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="153.079" y1="630.49" x2="153.079" y2="651.99" style="stroke:#444;stroke-width:1;"/><polygon points="149.079,641.99,153.079,651.99,157.079,641.99,153.079,645.99" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="956.722" y1="221.49" x2="956.722" y2="241.49" style="stroke:#444;stroke-width:1;"/><polygon points="952.722,231.49,956.722,241.49,960.722,231.49,956.722,235.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="956.722" y1="287.49" x2="956.722" y2="307.49" style="stroke:#444;stroke-width:1;"/><polygon points="952.722,297.49,956.722,307.49,960.722,297.49,956.722,301.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="956.722" y1="353.49" x2="956.722" y2="373.49" style="stroke:#444;stroke-width:1;"/><polygon points="952.722,363.49,956.722,373.49,960.722,363.49,956.722,367.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1112.4" y1="520.99" x2="1112.4" y2="542.49" style="stroke:#444;stroke-width:1;"/><polygon points="1108.4,532.49,1112.4,542.49,1116.4,532.49,1112.4,536.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="811.043" y1="451.49" x2="801.043" y2="451.49" style="stroke:#444;stroke-width:1;"/><line x1="801.043" y1="451.49" x2="801.043" y2="473.49" style="stroke:#444;stroke-width:1;"/><polygon points="797.043,463.49,801.043,473.49,805.043,463.49,801.043,467.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1102.4" y1="451.49" x2="1112.4" y2="451.49" style="stroke:#444;stroke-width:1;"/><line x1="1112.4" y1="451.49" x2="1112.4" y2="474.99" style="stroke:#444;stroke-width:1;"/><polygon points="1108.4,464.99,1112.4,474.99,1116.4,464.99,1112.4,468.99" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="801.043" y1="519.49" x2="801.043" y2="569.49" style="stroke:#444;stroke-width:1;"/><line x1="801.043" y1="569.49" x2="153.079" y2="569.49" style="stroke:#444;stroke-width:1;"/><line x1="153.079" y1="569.49" x2="153.079" y2="584.49" style="stroke:#444;stroke-width:1;"/><polygon points="149.079,574.49,153.079,584.49,157.079,574.49,153.079,578.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="956.722" y1="419.49" x2="956.722" y2="439.49" style="stroke:#444;stroke