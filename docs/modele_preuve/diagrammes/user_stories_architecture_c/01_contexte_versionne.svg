<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1215px;height:694px;background:#FFFFFF;" width="1215px" height="694px" viewBox="0 0 1215 694" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="434.589" y="30.78" fill="#000" font-size="14" textLength="344.668" font-weight="700" font-family="Helvetica">US-C-01 — Créer une analyse ou une version d’acte</text></g><rect x="20" y="51.49" width="1168.846" height="13" fill="none" style="stroke:none;"/><ellipse cx="247.142" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="128.391" y="109.49" width="237.502" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="138.391" y="129.5" fill="#172B4D" font-size="13" textLength="217.502" font-family="Helvetica">Choisir la cause et la nature du travail</text><polygon points="196.916,162.49,297.368,162.49,309.368,174.49,297.368,186.49,196.916,186.49,184.916,174.49,196.916,162.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="196.916" y="178" fill="#172B4D" font-size="13" textLength="100.452" font-family="Helvetica">Analyse interne ?</text><text x="167.568" y="171.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="309.368" y="171.5" fill="#000" font-size="13" textLength="133.682" font-family="Helvetica">acte ou communication</text><rect x="26" y="196.49" width="187.661" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="216.5" fill="#172B4D" font-size="13" textLength="167.661" font-family="Helvetica">Créer une analyse autonome</text><rect x="233.661" y="196.49" width="281.587" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="243.661" y="216.5" fill="#172B4D" font-size="13" textLength="261.587" font-family="Helvetica">Créer l’acte ou demander sa nouvelle version</text><polygon points="247.142,235.49,259.142,247.49,247.142,259.49,235.142,247.49,247.142,235.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="138.141" y="520.49" width="218.002" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="148.141" y="540.5" fill="#172B4D" font-size="13" textLength="198.002" font-family="Helvetica">Rédiger dans ce contexte explicite</text><line x1="20" y1="51.49" x2="20" y2="661.49" style="stroke:#000;stroke-width:1.5;"/><path d="M924.34,269.49 L924.34,315.99 L904.34,319.99 L924.34,323.99 L924.34,370.49 A0,0 0 0 0 924.34,370.49 L1183.041,370.49 A0,0 0 0 0 1183.041,370.49 L1183.041,279.49 L1173.041,269.49 L924.34,269.49 A0,0 0 0 0 924.34,269.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1173.041,269.49 L1173.041,279.49 L1183.041,279.49 L1173.041,269.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="930.34" y="284.5" fill="#000" font-size="13" textLength="203.055" font-family="Helvetica">Une Cause contient plusieurs Acte.</text><text x="930.34" y="297.5" fill="#000" font-size="13" textLength="231.956" font-family="Helvetica">Un Acte possède plusieurs VersionActe.</text><text x="930.34" y="310.5" fill="#000" font-size="13" textLength="237.701" font-family="Helvetica">FIGEE ne redevient jamais BROUILLON.</text><text x="930.34" y="323.5" fill="#000" font-size="13" textLength="169.114" font-family="Helvetica">Une analyse ne crée ni dépôt</text><text x="930.34" y="336.5" fill="#000" font-size="13" textLength="127.15" font-family="Helvetica">ni transmission fictive.</text><text x="930.34" y="349.5" fill="#000" font-size="13" textLength="201.633" font-family="Helvetica">La cause d’usage ne remplace pas</text><text x="930.34" y="362.5" fill="#000" font-size="13" textLength="178.49" font-family="Helvetica">la cause d’origine des sources.</text><rect x="650.251" y="290.49" width="254.089" height="59" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="660.251" y="310.5" fill="#172B4D" font-size="13" textLength="201.602" font-family="Helvetica">Rattacher l’Acte à la Cause choisie</text><text x="660.251" y="323.5" fill="#172B4D" font-size="13" textLength="213.859" font-family="Helvetica">et créer sa VersionActe BROUILLON</text><text x="660.251" y="336.5" fill="#172B4D" font-size="13" textLength="234.089" font-family="Helvetica">avec son Document PRODUCED propre</text><polygon points="674.676,390.49,879.915,390.49,891.915,402.49,879.915,414.49,674.676,414.49,662.676,402.49,674.676,390.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="674.676" y="406" fill="#172B4D" font-size="13" textLength="205.239" font-family="Helvetica">Version issue d’une version gelée ?</text><text x="645.328" y="399.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="891.915" y="399.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="525.248" y="424.49" width="254.857" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="535.248" y="444.5" fill="#172B4D" font-size="13" textLength="234.857" font-family="Helvetica">Ouvrir un nouveau brouillon avec filiation</text><text x="535.248" y="457.5" fill="#172B4D" font-size="13" textLength="182.832" font-family="Helvetica">sans modifier le contenu ancien</text><rect x="817.139" y="424.49" width="169.551" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="827.139" y="444.5" fill="#172B4D" font-size="13" textLength="149.551" font-family="Helvetica">Ouvrir le premier brouillon</text><polygon po