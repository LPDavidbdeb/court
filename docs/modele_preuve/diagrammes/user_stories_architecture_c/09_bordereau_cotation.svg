<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1063px;height:1092px;background:#FFFFFF;" width="1063px" height="1092px" viewBox="0 0 1063 1092" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="317.001" y="30.78" fill="#000" font-size="14" textLength="427.909" font-weight="700" font-family="Helvetica">US-C-09 — Préparer un bordereau traçable sans contourner D05</text></g><rect x="20" y="51.49" width="1016.912" height="13" fill="none" style="stroke:none;"/><ellipse cx="143.313" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="109.49" width="234.627" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="129.5" fill="#172B4D" font-size="13" textLength="214.627" font-family="Helvetica">Demander le bordereau de la version</text><line x1="20" y1="51.49" x2="20" y2="1059.99" style="stroke:#000;stroke-width:1.5;"/><rect x="459.942" y="162.49" width="264.969" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="469.942" y="182.5" fill="#172B4D" font-size="13" textLength="235.555" font-family="Helvetica">Réunir les seuls documents et fragments</text><text x="469.942" y="195.5" fill="#172B4D" font-size="13" textLength="244.969" font-family="Helvetica">effectivement sélectionnés par ses usages</text><rect x="466.803" y="228.49" width="251.245" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="476.803" y="248.5" fill="#172B4D" font-size="13" textLength="190.074" font-family="Helvetica">Dédupliquer par identité qualifiée</text><text x="476.803" y="261.5" fill="#172B4D" font-size="13" textLength="231.245" font-family="Helvetica">en conservant tous les chemins d’usage</text><rect x="458.866" y="294.49" width="267.121" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="468.866" y="314.5" fill="#172B4D" font-size="13" textLength="247.121" font-family="Helvetica">Résoudre les dates métier et leur précision</text><text x="468.866" y="327.5" fill="#172B4D" font-size="13" textLength="241.325" font-family="Helvetica">sans date d’import comme repli silencieux</text><rect x="479.102" y="408.99" width="226.648" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="489.102" y="429" fill="#172B4D" font-size="13" textLength="188.589" font-family="Helvetica">Produire le diagnostic A_DATER</text><text x="489.102" y="442" fill="#172B4D" font-size="13" textLength="206.648" font-family="Helvetica">et refuser la sortie stricte concernée</text><ellipse cx="592.426" cy="488.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="592.426" cy="488.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="516.54,360.49,668.312,360.49,680.312,372.49,668.312,384.49,516.54,384.49,504.54,372.49,516.54,360.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="596.426" y="394.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="516.54" y="376" fill="#172B4D" font-size="13" textLength="151.772" font-family="Helvetica">Date requise non établie ?</text><rect x="470.05" y="541.49" width="244.751" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="480.05" y="561.5" fill="#172B4D" font-size="13" textLength="219.661" font-family="Helvetica">Établir un ordre de travail déterministe</text><text x="480.05" y="574.5" fill="#172B4D" font-size="13" textLength="224.751" font-family="Helvetica">sans inventer d’heure pour un jour seul</text><rect x="475.109" y="607.49" width="234.633" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="485.109" y="627.5" fill="#172B4D" font-size="13" textLength="203.772" font-family="Helvetica">Conserver les cotes déjà attribuées</text><text x="485.109" y="640.5" fill="#172B4D" font-size="13" textLength="214.633" font-family="Helvetica">et leur identité historique permanente</text><polygon points="440.308,721.99,744.544,721.99,756.544,733.99,744.544,745.99,440.308,745.99,428.308,733.99,440.308,721.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="440.308" y="737.5" fill="#172B4D" font-size="13" textLength="304.237" font-family="Helvetica">Politique future explicitement arbitrée et approuvée ?</text><text x="377.723" y="731" fill="#000" font-size="13" textLength="50.584" font-family="Helvetica">oui, futur</text><text x="756.544" y="731" fill="#000" font-size="13" textLength="88.899" font-family="Helvetica">non, état actuel</text><rect x="270.627" y="755.99" width="295.361" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="280.627" y="776" fill="#172B4D" font-size="13" textLength="275.361" font-family="Helvetica">Appliquer uniquement cette politique approuvée</text><text x="280.627" y="789" fill="#172B4D" font-size="13" textLength="218.213" font-family="Helvetica">avec son profil et sa version explicites</text><rect x="622.133" y="755.99" width="288.823" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="632.133" y="776" fill="#172B4D" font-size="13" textLength="235.568" font-family="Helvetica">Présenter les identités et rangs de travail</text><text x="632.133" y="789" fill="#172B4D" font-size="13" textLength="268.823" font-family="Helvetica">sans attribuer une nouvelle cotation officielle C</text><rect x="687.526" y="831.49" width="158.036" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="697.526" y="851.5" fill="#172B4D" font-size="13" textLength="138.036" font-family="Helvetica">Signaler le blocage D05</text><ellipse cx="766.544" cy="895.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="766.544" cy="895.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="461.982,673.49,722.87,673.49,734.87,685.49,722.87,697.49,461.982,697.49,449.982,685.49,461.982,673.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="596.426" y="707.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="461.982" y="689" fill="#172B4D" font-size="13" textLength="260.889" font-family="Helvetica">Nouvelle cotation procédurale C demandée ?</text><polygon points="592.426,926.49,604.426,938.49,592.426,950.49,580.426,938.49,592.426,926.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M746.361,968.99 L746.361,989.49 L726.361,993.49 L746.361,997.49 L746.361,1017.99 A0,0 0 0 0 746.361,1017.99 L1031.106,1017.99 A0,0 0 0 0 1031.106,1017.99 L1031.106,978.99 L1021.106,968.99 L746.361,968.99 A0,0 0 0 0 746.361,968.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1021.106,968.99 L1021.106,978.99 L1031.106,978.99 L1021.106,968.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="752.361" y="984" fill="#000" font-size="13" textLength="199.443" font-family="Helvetica">Aucun recalcul des cotes de juillet.</text><text x="752.361" y="997" fill="#000" font-size="13" textLength="244.258" font-family="Helvetica">Une sous-cote active nouvelle attend D05.</text><text x="752.361" y="1010" fill="#000" font-size="13" textLength="263.745" font-family="Helvetica">L’unité de fragment reste l’occurrence source.</text><rect x="458.491" y="970.49" width="267.87" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="468.491" y="990.5" fill="#172B4D" font-size="13" textLength="247.87" font-family="Helvetica">Publier le bordereau dans ResultatVersion,</text><text x="468.491" y="1003.5" fill="#172B4D" font-size="13" textLength="171.983" font-family="Helvetica">autorité commune aux rendus</text><ellipse cx="592.426" cy="1048.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="592.426" cy="1048.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="264.627" y1="51.49" x2="264.627" y2="1059.99" style="stroke:#000;stroke-width:1.5;"/><line x1="1036.106" y1="51.49" x2="1036.106" y2="1059.99" style="stroke:#000;stroke-width:1.5;"/><line x1="143.313" y1="89.49" x2="143.313" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="139.313,99.49,143.313,109.49,147.313,99.49,143.313,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="592.426" y1="208.49" x2="592.426" y2="228.49" style="stroke:#444;stroke-width:1;"/><polygon points="588.426,218.49,592.426,228.49,596.426,218.49,592.426,222.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="592.426" y1="274.49" x2="592.426" y2="294.49" style="stroke:#444;stroke-width:1;"/><polygon points="588.426,284.49,592.426,294.49,596.426,284.49,592.426,288.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="592.426" y1="454.99" x2="592.426" y2="477.49" style="stroke:#444;stroke-width:1;"/><polygon points="588.426,467.49,592.426,477.49,596.426,467.49,592.426,471.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="592.426" y1="384.49" x2="592.426" y2="408.99" style="stroke:#444;stroke-width:1;"/><polygon points="588.426,398.99,592.426,408.99,596.426,398.99,592.426,402.99" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-mi