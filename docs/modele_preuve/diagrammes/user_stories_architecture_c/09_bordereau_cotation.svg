<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1363px;height:1089px;background:#FFFFFF;" width="1363px" height="1089px" viewBox="0 0 1363 1089" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="438.611" y="30.78" fill="#000" font-size="14" textLength="484.682" font-weight="700" font-family="Helvetica">US-C-09 — Coter les documents et sous-coter leurs citations par version</text></g><rect x="20" y="51.49" width="1316.905" height="13" fill="none" style="stroke:none;"/><ellipse cx="143.313" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="109.49" width="234.627" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="129.5" fill="#172B4D" font-size="13" textLength="214.627" font-family="Helvetica">Demander le bordereau de la version</text><line x1="20" y1="51.49" x2="20" y2="1056.49" style="stroke:#000;stroke-width:1.5;"/><rect x="704.284" y="162.49" width="264.969" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="714.284" y="182.5" fill="#172B4D" font-size="13" textLength="235.555" font-family="Helvetica">Réunir les seuls documents et fragments</text><text x="714.284" y="195.5" fill="#172B4D" font-size="13" textLength="244.969" font-family="Helvetica">effectivement sélectionnés par ses usages</text><rect x="673.743" y="228.49" width="326.052" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="683.743" y="248.5" fill="#172B4D" font-size="13" textLength="306.052" font-family="Helvetica">Identifier chaque document par modèle qualifié + PK,</text><text x="683.743" y="261.5" fill="#172B4D" font-size="13" textLength="265.941" font-family="Helvetica">chaque citation et son document parent vérifié</text><rect x="697.07" y="294.49" width="279.397" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="707.07" y="314.5" fill="#172B4D" font-size="13" textLength="259.397" font-family="Helvetica">Réunir les documents retenus sans multiplier</text><text x="707.07" y="327.5" fill="#172B4D" font-size="13" textLength="246.435" font-family="Helvetica">leur cote pour chaque citation ou utilisation</text><rect x="703.209" y="360.49" width="267.121" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="713.209" y="380.5" fill="#172B4D" font-size="13" textLength="247.121" font-family="Helvetica">Résoudre les dates métier et leur précision</text><text x="713.209" y="393.5" fill="#172B4D" font-size="13" textLength="241.325" font-family="Helvetica">sans date d’import comme repli silencieux</text><rect x="723.445" y="474.99" width="226.648" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="733.445" y="495" fill="#172B4D" font-size="13" textLength="188.589" font-family="Helvetica">Produire le diagnostic A_DATER</text><text x="733.445" y="508" fill="#172B4D" font-size="13" textLength="206.648" font-family="Helvetica">et refuser la sortie stricte concernée</text><ellipse cx="836.769" cy="554.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="836.769" cy="554.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="760.883,426.49,912.655,426.49,924.655,438.49,912.655,450.49,760.883,450.49,748.883,438.49,760.883,426.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="840.769" y="460.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="760.883" y="442" fill="#172B4D" font-size="13" textLength="151.772" font-family="Helvetica">Date requise non établie ?</text><rect x="714.393" y="607.49" width="244.751" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="724.393" y="627.5" fill="#172B4D" font-size="13" textLength="219.661" font-family="Helvetica">Établir un ordre de travail déterministe</text><text x="724.393" y="640.5" fill="#172B4D" font-size="13" textLength="224.751" font-family="Helvetica">sans inventer d’heure pour un jour seul</text><rect x="696.705" y="673.49" width="280.127" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="706.705" y="693.5" fill="#172B4D" font-size="13" textLength="260.127" font-family="Helvetica">Calculer les cotes principales des documents</text><text x="706.705" y="706.5" fill="#172B4D" font-size="13" textLength="210.304" font-family="Helvetica">dans le bordereau de la VersionActe</text><polygon points="710.666,739.49,962.871,739.49,974.871,751.49,962.871,763.49,710.666,763.49,698.666,751.49,710.666,739.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="710.666" y="755" fill="#172B4D" font-size="13" textLength="252.205" font-family="Helvetica">Citations sélectionnées pour ce document ?</text><text x="681.318" y="748.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="974.871" y="748.5" fill="#000" font-size="13" textLength="42.65" font-family="Helvetica">aucune</text><polygon points="465.728,773.49,727.347,773.49,739.347,785.49,727.347,797.49,465.728,797.49,453.728,785.49,465.728,773.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="465.728" y="789" fill="#172B4D" font-size="13" textLength="261.619" font-family="Helvetica">Profil de notation et d’ordre technique défini ?</text><text x="436.38" y="782.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="739.347" y="782.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="270.627" y="807.49" width="322.764" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="280.627" y="827.5" fill="#172B4D" font-size="13" textLength="302.764" font-family="Helvetica">Attribuer leurs sous-cotes sous la cote du document,</text><text x="280.627" y="840.5" fill="#172B4D" font-size="13" textLength="239.205" font-family="Helvetica">sans cote principale autonome de citation</text><rect x="613.391" y="807.49" width="295.349" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="623.391" y="827.5" fill="#172B4D" font-size="13" textLength="275.349" font-family="Helvetica">Diagnostiquer la modalité technique manquante</text><text x="623.391" y="840.5" fill="#172B4D" font-size="13" textLength="156.787" font-family="Helvetica">et refuser le strict concerné</text><ellipse cx="761.065" cy="884.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="761.065" cy="884.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="938.74" y="773.49" width="276.521" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="948.74" y="793.5" fill="#172B4D" font-size="13" textLength="164.747" font-family="Helvetica">Conserver la cote principale,</text><text x="948.74" y="806.5" fill="#172B4D" font-size="13" textLength="256.521" font-family="Helvetica">sans créer de sous-cote ou de citation fictive</text><polygon points="836.769,905.49,848.769,917.49,836.769,929.49,824.769,917.49,836.769,905.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M990.704,939.49 L990.704,972.99 L970.704,976.99 L990.704,980.99 L990.704,1014.49 A0,0 0 0 0 990.704,1014.49 L1331.099,1014.49 A0,0 0 0 0 1331.099,1014.49 L1331.099,949.49 L1321.099,939.49 L990.704,939.49 A0,0 0 0 0 990.704,939.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1321.099,939.49 L1321.099,949.49 L1331.099,949.49 L1321.099,939.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="996.704" y="954.5" fill="#000" font-size="13" textLength="252.167" font-family="Helvetica">Gel : conserver documents, citations, cotes,</text><text x="996.704" y="967.5" fill="#000" font-size="13" textLength="242.779" font-family="Helvetica">sous-cotes et cartes d’utilisations exactes.</text><text x="996.704" y="980.5" fill="#000" font-size="13" textLength="319.395" font-family="Helvetica">Nouvelle version : recotation possible, identités stables.</text><text x="996.704" y="993.5" fill="#000" font-size="13" textLength="306.389" font-family="Helvetica">Aucun recalcul des associations historiques de juillet.</text><text x="996.704" y="1006.5" fill="#000" font-size="13" textLength="309.283" font-family="Helvetica">Le principe cote / sous-cote est définitivement décidé.</text><rect x="702.834" y="953.99" width="267.87" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="712.834" y="974" fill="#172B4D" font-size="13" textLength="247.87" font-family="Helvetica">Publier le bordereau dans ResultatVersion,</text><text x="712.834" y="987" fill="#172B4D" font-size="13" textLength="171.983" font-family="Helvetica">autorité commune aux rendus</text><ellipse cx="836.769" cy="1045.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="836.769" cy="1045.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="264.627" y1="51.49" x2="264.627" y2="1056.49" style="stroke:#000;stroke-width:1.5;"/><line x1="1336.099" y1="51.49" x2="1336.099" y2="1056.49" style="stroke:#000;stroke-width:1.5;"/><line x1="143.313" y1="89.49" x2="143.313" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="139.313,99.49,143.313,109.49,147.313,99.49,143.313,103.49" fill="#444" style="stroke:#444;stroke-width:1;