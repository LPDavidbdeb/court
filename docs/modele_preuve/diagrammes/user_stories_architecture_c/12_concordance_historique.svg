<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1239px;height:1184px;background:#FFFFFF;" width="1239px" height="1184px" viewBox="0 0 1239 1184" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="415.435" y="30.78" fill="#000" font-size="14" textLength="406.93" font-weight="700" font-family="Helvetica">US-C-12 — Comparer la rédaction actuelle avec l’histoire E01</text></g><rect x="20" y="51.49" width="1192.8" height="13" fill="none" style="stroke:none;"/><ellipse cx="325.553" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="225.953" y="109.49" width="199.201" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="235.953" y="129.5" fill="#172B4D" font-size="13" textLength="178.483" font-family="Helvetica">Choisir le couple documentaire</text><text x="235.953" y="142.5" fill="#172B4D" font-size="13" textLength="179.201" font-family="Helvetica">et le périmètre de comparaison</text><rect x="26" y="800.49" width="271.494" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="820.5" fill="#172B4D" font-size="13" textLength="226.154" font-family="Helvetica">Relire les occurrences et textes actuels</text><text x="36" y="833.5" fill="#172B4D" font-size="13" textLength="251.494" font-family="Helvetica">puis prendre une nouvelle décision explicite</text><line x1="20" y1="51.49" x2="20" y2="1151.49" style="stroke:#000;stroke-width:1.5;"/><rect x="628.235" y="175.49" width="249.785" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="638.235" y="195.5" fill="#172B4D" font-size="13" textLength="220.422" font-family="Helvetica">Lire la filiation de la nature demandée,</text><text x="638.235" y="208.5" fill="#172B4D" font-size="13" textLength="229.785" font-family="Helvetica">les archives et les décisions disponibles</text><path d="M918.599,233.49 L918.599,260.49 L898.599,264.49 L918.599,268.49 L918.599,295.49 A0,0 0 0 0 918.599,295.49 L1206.994,295.49 A0,0 0 0 0 1206.994,295.49 L1206.994,243.49 L1196.994,233.49 L918.599,233.49 A0,0 0 0 0 918.599,233.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1196.994,233.49 L1196.994,243.49 L1206.994,243.49 L1196.994,233.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="924.599" y="248.5" fill="#000" font-size="13" textLength="212.481" font-family="Helvetica">Le dépôt de juillet est un acte papier.</text><text x="924.599" y="261.5" fill="#000" font-size="13" textLength="230.502" font-family="Helvetica">Des structures d’analyse créées ensuite</text><text x="924.599" y="274.5" fill="#000" font-size="13" textLength="244.981" font-family="Helvetica">ne sont pas présentées comme déposées.</text><text x="924.599" y="287.5" fill="#000" font-size="13" textLength="267.395" font-family="Helvetica">Une source ou capture absente reste absente.</text><rect x="607.656" y="241.49" width="290.943" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="617.656" y="261.5" fill="#172B4D" font-size="13" textLength="257.251" font-family="Helvetica">Présenter séparément la décision historique,</text><text x="617.656" y="274.5" fill="#172B4D" font-size="13" textLength="270.943" font-family="Helvetica">sa compatibilité actuelle et l’admissibilité stricte</text><rect x="634.008" y="363.99" width="238.239" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="644.008" y="384" fill="#172B4D" font-size="13" textLength="210.983" font-family="Helvetica">Conserver les informations attestées</text><text x="644.008" y="397" fill="#172B4D" font-size="13" textLength="218.239" font-family="Helvetica">avec leur provenance héritée explicite</text><rect x="641.971" y="429.99" width="222.313" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="651.971" y="450" fill="#172B4D" font-size="13" textLength="202.313" font-family="Helvetica">Refuser qu’elles suffisent à certifier</text><text x="651.971" y="463" fill="#172B4D" font-size="13" textLength="174.135" font-family="Helvetica">le nouvel export strict renforcé</text><rect x="598.963" y="553.99" width="308.33" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="608.963" y="574" fill="#172B4D" font-size="13" textLength="288.33" font-family="Helvetica">Ajouter d’abord un RELEVE_HERITE daté du jour</text><text x="608.963" y="587" fill="#172B4D" font-size="13" textLength="209.562" font-family="Helvetica">sans reconstruire un ancien examen</text><polygon points="613.292,505.49,892.963,505.49,904.963,517.49,892.963,529.49,613.292,529.49,601.292,517.49,613.292,505.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="757.128" y="539.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="613.292" y="521" fill="#172B4D" font-size="13" textLength="279.671" font-family="Helvetica">Remplacement futur d’une projection ancienne ?</text><polygon points="753.128,619.99,765.128,631.99,753.128,643.99,741.128,631.99,753.128,619.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="613.305,315.49,892.951,315.49,904.951,327.49,892.951,339.49,613.305,339.49,601.305,327.49,613.305,315.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="757.128" y="349.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="613.305" y="331" fill="#172B4D" font-size="13" textLength="279.646" font-family="Helvetica">Ancienne confirmation sans manifeste complet ?</text><polygon points="753.128,663.99,765.128,675.99,753.128,687.99,741.128,675.99,753.128,663.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="683.754,756.49,822.501,756.49,834.501,768.49,822.501,780.49,683.754,780.49,671.754,768.49,683.754,756.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="683.754" y="772" fill="#172B4D" font-size="13" textLength="138.747" font-family="Helvetica">Destination modifiable ?</text><text x="654.406" y="765.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="834.501" y="765.5" fill="#000" font-size="13" textLength="77.327" font-family="Helvetica">version gelée</text><rect x="435.154" y="866.49" width="308.336" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="445.154" y="886.5" fill="#172B4D" font-size="13" textLength="288.336" font-family="Helvetica">Ajouter un examen avec manifeste et date actuels</text><text x="445.154" y="899.5" fill="#172B4D" font-size="13" textLength="184.266" font-family="Helvetica">sans effacer l’histoire disponible</text><rect x="449.274" y="932.49" width="280.095" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="459.274" y="952.5" fill="#172B4D" font-size="13" textLength="260.095" font-family="Helvetica">Évaluer les autres critères stricts séparément</text><rect x="763.49" y="800.49" width="306.889" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="773.49" y="820.5" fill="#172B4D" font-size="13" textLength="167.654" font-family="Helvetica">Conserver la lacune signalée</text><text x="773.49" y="833.5" fill="#172B4D" font-size="13" textLength="286.889" font-family="Helvetica">et demander une nouvelle version pour la corriger</text><polygon poi