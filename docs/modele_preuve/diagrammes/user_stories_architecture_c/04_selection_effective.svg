47,872.49,35,860.49,47,848.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="183.596" y="882.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="47" y="864" fill="#172B4D" font-size="13" textLength="265.192" font-family="Helvetica">Autre preuve nécessaire pour la même cible ?</text><polygon points="179.596,962.99,191.596,974.99,179.596,986.99,167.596,974.99,179.596,962.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="20" y1="51.49" x2="20" y2="1094.99" style="stroke:#000;stroke-width:1.5;"/><rect x="502.598" y="276.99" width="242.568" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="512.598" y="297" fill="#172B4D" font-size="13" textLength="222.568" font-family="Helvetica">Refuser le plan entier sans effet partiel</text><ellipse cx="623.882" cy="349.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="623.882" cy="349.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="471.782,228.49,775.981,228.49,787.981,240.49,775.981,252.49,471.782,252.49,459.782,240.49,471.782,228.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="627.882" y="262.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><text x="471.782" y="244" fill="#172B4D" font-size="13" textLength="304.199" font-family="Helvetica">Occurrence, usage, révision et nœuds compatibles ?</text><rect x="475.5" y="402.99" width="296.764" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="485.5" y="423" fill="#172B4D" font-size="13" textLength="276.764" font-family="Helvetica">Développer uniquement les sélections explicites</text><text x="485.5" y="436" fill="#172B4D" font-size="13" textLength="104.063" font-family="Helvetica">de cette utilisation</text><rect x="510.535" y="517.49" width="226.692" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="520.535" y="537.5" fill="#172B4D" font-size="13" textLength="168.384" font-family="Helvetica">Vérifier le contenant désigné,</text><text x="520.535" y="550.5" fill="#172B4D" font-size="13" textLength="206.692" font-family="Helvetica">l’appartenance et l’ordre des photos</text><polygon points="522.357,583.49,725.406,583.49,737.406,595.49,725.406,607.49,522.357,607.49,510.357,595.49,522.357,583.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="522.357" y="599" fill="#172B4D" font-size="13" textLength="203.049" font-family="Helvetica">Informations vérifiées disponibles ?</text><text x="493.009" y="592.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="737.406" y="592.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="361.192" y="617.49" width="249.081" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="371.192" y="637.5" fill="#172B4D" font-size="13" textLength="229.081" font-family="Helvetica">Retenir les seules photos sélectionnées</text><text x="371.192" y="650.5" fill="#172B4D" font-size="13" textLength="210.99" font-family="Helvetica">et conserver leur Event source intact</text><rect x="630.273" y="617.49" width="263.515" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="640.273" y="637.5" fill="#172B4D" font-size="13" textLength="156.083" font-family="Helvetica">Signaler CF4 non satisfaite</text><text x="640.273" y="650.5" fill="#172B4D" font-size="13" textLength="243.515" font-family="Helvetica">et refuser la qualification stricte concernée</text><ellipse cx="762.031" cy="694.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="762.031" cy="694.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="524.88,468.99,722.883,468.99,734.883,480.99,722.883,492.99,524.88,492.99,512.88,480.99,524.88,468.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="627.882" y="503" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="524.88" y="484.5" fill="#172B4D" font-size="13" textLength="198.002" font-family="Helvetica">Photo utilisée à travers un Event ?</text><polygon points="623.882,725.49,635.882,737.49,623.882,749.49,611.882,737.49,623.882,725.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M775.63,774.49 L775.63,794.99 L755.63,798.99 L775.63,802.99 L775.63,823.49 A0,0 0 0 0 775.63,823.49 L1025.71,823.49 A0,0 0 0 0 1025.71,823.49 L1025.71,784.49 L1015.71,774.49 L775.63,774.49 A0,0 0 0 0 775.63,774.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1015.71,774.49 L1015.71,784.49 L1025.71,784.49 L1015.71,774.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="781.63" y="789.5" fill="#000" font-size="13" textLength="220.429" font-family="Helvetica">Les feuilles d’une branche non choisie</text><text x="781.63" y="802.5" fill="#000" font-size="13" textLength="229.081" font-family="Helvetica">restent hors de cet usage et du résultat.</text><text x="781.63" y="815.5" fill="#000" font-size="13" textLength="207.372" font-family="Helvetica">Choisir l’Event entier ne le filtre pas.</text><rect x="492.134" y="769.49" width="263.496" height="59" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="502.134" y="789.5" fill="#172B4D" font-size="13" textLength="243.496" font-family="Helvetica">Établir les fragments et documents utilisés</text><text x="502.134" y="802.5" fill="#172B4D" font-size="13" textLength="214.621" font-family="Helvetica">en conservant leurs chemins d’usage</text><text x="502.134" y="815.5" fill="#172B4D" font-size="13" textLength="200.897" font-family="Helvetica">et la révision exacte de chaque UP</text><rect x="488.141" y="1006.99" width="271.481" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="498.141" y="1027" fill="#172B4D" font-size="13" textLength="181.372" font-family="Helvetica">Projeter les supports de la cible</text><text x="498.141" y="1040" fill="#172B4D" font-size="13" textLength="251.481" font-family="Helvetica">sans héritage automatique vers ses enfants</text><ellipse cx="623.882" cy="1083.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="623.882" cy="1083.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="355.192" y1="51.49" x2="355.192" y2="1094.99" style="stroke:#000;stroke-width:1.5;"/><line x1="1030.71" y1="51.49" x2="1030.71" y2="1094.99" style="stroke:#000;stroke-width:1.5;"/><line x1="179.596" y1="89.49" x2="179.596" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="175.596,99.49,179.596,109.49,183.596,99.49,179.596,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="179.596" y1="142.49" x2="179.596" y2="162.49" style="stroke:#444;stroke-width:1;"/><polygon points="175.596,152.49,179.596,162.49,183.596,152.49,179.596,156.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="179.596" y1="872.49" x2="179.596" y2="896.99" style="stroke:#444;stroke-width:1;"/><polygon points="175.596,886.99,179.596,896.99,183.596,886.99,179.596,890.99" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="324.192" y1="860.49" x2="336.192" y2="860.49" style="stroke:#444;stroke-width:1;"/><polygon points="332.192,909.99,336.192,919.99,340.192,909.99,336.192,913.99" fill="#444" style="stroke:#444;stroke-wi