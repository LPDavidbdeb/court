<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1316px;height:807px;background:#FFFFFF;" width="1316px" height="807px" viewBox="0 0 1316 807" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="431.48" y="30.78" fill="#000" font-size="14" textLength="451.254" font-weight="700" font-family="Helvetica">US-C-05 — Rattacher des appuis et examiner la filiation séparément</text></g><rect x="20" y="51.49" width="1269.214" height="13" fill="none" style="stroke:none;"/><ellipse cx="151.638" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="109.49" width="251.277" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="129.5" fill="#172B4D" font-size="13" textLength="209.555" font-family="Helvetica">Rattacher 0..N utilisations de preuve</text><text x="36" y="142.5" fill="#172B4D" font-size="13" textLength="231.277" font-family="Helvetica">à une proposition ou à un regroupement</text><line x1="20" y1="51.49" x2="20" y2="774.49" style="stroke:#000;stroke-width:1.5;"/><path d="M678.793,173.99 L678.793,194.49 L658.793,198.49 L678.793,202.49 L678.793,222.99 A0,0 0 0 0 678.793,222.99 L923.085,222.99 A0,0 0 0 0 923.085,222.99 L923.085,183.99 L913.085,173.99 L678.793,173.99 A0,0 0 0 0 678.793,173.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M913.085,173.99 L913.085,183.99 L923.085,183.99 L913.085,173.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="684.793" y="189" fill="#000" font-size="13" textLength="223.292" font-family="Helvetica">Une utilisation ne déclare pas la vérité.</text><text x="684.793" y="202" fill="#000" font-size="13" textLength="195.87" font-family="Helvetica">Les appuis du groupe ne sont pas</text><text x="684.793" y="215" fill="#000" font-size="13" textLength="209.581" font-family="Helvetica">des confirmations de chaque enfant.</text><rect x="431.415" y="175.49" width="227.378" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="441.415" y="195.5" fill="#172B4D" font-size="13" textLength="207.378" font-family="Helvetica">Conserver la portée, la version cible</text><text x="441.415" y="208.5" fill="#172B4D" font-size="13" textLength="198.726" font-family="Helvetica">et 1..N sélections par usage valide</text><rect x="424.906" y="357.49" width="240.397" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="434.906" y="377.5" fill="#172B4D" font-size="13" textLength="220.397" font-family="Helvetica">Recontrôler sous verrou l’état attendu,</text><text x="434.906" y="390.5" fill="#172B4D" font-size="13" textLength="214.627" font-family="Helvetica">la qualification, le couple et les textes</text><polygon points="428.025,432.99,662.184,432.99,674.184,444.99,662.184,456.99,428.025,456.99,416.025,444.99,428.025,432.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="428.025" y="448.5" fill="#172B4D" font-size="13" textLength="234.159" font-family="Helvetica">État inchangé et destination modifiable ?</text><text x="398.677" y="442" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="674.184" y="442" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="287.277" y="466.99" width="237.496" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="297.277" y="487" fill="#172B4D" font-size="13" textLength="217.496" font-family="Helvetica">Ajouter un ExamenEditorial immuable</text><text x="297.277" y="500" fill="#172B4D" font-size="13" textLength="175.602" font-family="Helvetica">avec manifeste et date actuels</text><rect x="563.988" y="466.99" width="240.391" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="573.988" y="487" fill="#172B4D" font-size="13" textLength="220.391" font-family="Helvetica">Refuser l’ajout avec un conflit explicite</text><text x="573.988" y="500" fill="#172B4D" font-size="13" textLength="205.937" font-family="Helvetica">sans remplacer l’examen précédent</text><ellipse cx="684.184" cy="543.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="684.184" cy="543.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M680.958,683.49 L680.958,703.99 L660.958,707.99 L680.958,711.99 L680.958,732.49 A0,0 0 0 0 680.958,732.49 L948.386,732.49 A0,0 0 0 0 948.386,732.49 L948.386,693.49 L938.386,683.49 L680.958,683.49 A0,0 0 0 0 680.958,683.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M938.386,683.49 L938.386,693.49 L948.386,693.49 L938.386,683.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="686.958" y="698.5" fill="#000" font-size="13" textLength="215.319" font-family="Helvetica">Confirmer les appuis ne confirme pas</text><text x="686.958" y="711.5" fill="#000" font-size="13" textLength="216.785" font-family="Helvetica">une reformulation, et réciproquement.</text><text x="686.958" y="724.5" fill="#000" font-size="13" textLength="246.429" font-family="Helvetica">Les garanties de journal ne sont pas C0-A.</text><rect x="429.251" y="684.99" width="231.707" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="439.251" y="705" fill="#172B4D" font-size="13" textLength="211.707" font-family="Helvetica">Présenter les deux résultats distincts</text><text x="439.251" y="718" fill="#172B4D" font-size="13" textLength="157.542" font-family="Helvetica">pour les contrôles du rendu</text><ellipse cx="545.104" cy="763.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="545.104" cy="763.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="281.277" y1="51.49" x2="281.277" y2="774.49" style="stroke:#000;stroke-width:1.5;"/><rect x="959.386" y="291.49" width="296.021" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="969.386" y="311.5" fill="#172B4D" font-size="13" textLength="276.021" font-family="Helvetica">Examiner les bonnes occurrences source / cible</text><text x="969.386" y="324.5" fill="#172B4D" font-size="13" textLength="217.502" font-family="Helvetica">et décider du traitement avec un motif</text><polygon points="1017.435,242.99,1197.359,242.99,1209.359,254.99,1197.359,266.99,1017.435,266.99,1005.435,254.99,1017.435,242.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1111.397" y="277" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="1017.435" y="258.5" fill="#172B4D" font-size="13" textLength="179.924" font-family="Helvetica">Filiation éditoriale à examiner ?</text><polygon points="1107.397,574.99,1119.397,586.99,1107.397,598.99,1095.397,586.99,1107.397,574.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="994.787" y="618.99" width="225.22" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1004.787" y="639" fill="#172B4D" font-size="13" textLength="205.22" font-family="Helvetica">Examiner séparément la pertinence</text><text x="1004.787" y="652" fill="#172B4D" font-size="13" textLength="178.509" font-family="Helvetica">et la portée des appuis retenus</text><line x1="953.386" y1="51.49" x2="953.386" y2="774.49" style="stroke:#000;stroke-width:1.5;"/><line x1="1288.408" y1="51.49" x2="1288.408" y2="774.49" style="stroke:#000;stroke-width:1.5;"/><line x1="151.638" y1="89.49" x2="151.638" y2="109.49" style="stroke:#444;stroke-width:1;"/