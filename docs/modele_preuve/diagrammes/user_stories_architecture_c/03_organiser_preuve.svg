<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1253px;height:669px;background:#FFFFFF;" width="1253px" height="669px" viewBox="0 0 1253 669" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="417.57" y="30.78" fill="#000" font-size="14" textLength="416.261" font-weight="700" font-family="Helvetica">US-C-03 — Organiser les sources dans une preuve réutilisable</text></g><rect x="20" y="51.49" width="1206.401" height="13" fill="none" style="stroke:none;"/><ellipse cx="170.773" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="83.094" y="109.49" width="175.359" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="93.094" y="129.5" fill="#172B4D" font-size="13" textLength="155.359" font-family="Helvetica">Créer ou ouvrir une preuve</text><polygon points="64.536,162.49,277.011,162.49,289.011,174.49,277.011,186.49,64.536,186.49,52.536,174.49,64.536,162.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="64.536" y="178" fill="#172B4D" font-size="13" textLength="212.475" font-family="Helvetica">Appui constitué d’une seule source ?</text><text x="35.188" y="171.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="289.011" y="171.5" fill="#000" font-size="13" textLength="108.386" font-family="Helvetica">plusieurs éléments</text><rect x="191.434" y="206.49" width="251.232" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="201.434" y="226.5" fill="#172B4D" font-size="13" textLength="215.344" font-family="Helvetica">Organiser des groupes et des feuilles</text><text x="201.434" y="239.5" fill="#172B4D" font-size="13" textLength="231.232" font-family="Helvetica">référençant les éléments documentaires</text><polygon points="170.773,262.49,182.773,274.49,170.773,286.49,158.773,274.49,170.773,262.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M335.547,545.49 L335.547,565.99 L315.547,569.99 L335.547,573.99 L335.547,594.49 A0,0 0 0 0 335.547,594.49 L610.936,594.49 A0,0 0 0 0 610.936,594.49 L610.936,555.49 L600.936,545.49 L335.547,545.49 A0,0 0 0 0 335.547,545.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M600.936,545.49 L600.936,555.49 L610.936,555.49 L600.936,545.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="341.547" y="560.5" fill="#000" font-size="13" textLength="254.389" font-family="Helvetica">Le classement seul ne rattache aucun appui</text><text x="341.547" y="573.5" fill="#000" font-size="13" textLength="239.967" font-family="Helvetica">à un paragraphe et n’ajoute aucune pièce</text><text x="341.547" y="586.5" fill="#000" font-size="13" textLength="161.884" font-family="Helvetica">au bordereau de sa version.</text><rect x="26" y="553.49" width="289.547" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="573.5" fill="#172B4D" font-size="13" textLength="269.547" font-family="Helvetica">Retrouver cette preuve pour un usage ultérieur</text><ellipse cx="170.773" cy="625.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="170.773" cy="625.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="636.49" style="stroke:#000;stroke-width:1.5;"/><rect x="621.936" y="206.49" width="293.876" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="631.936" y="226.5" fill="#172B4D" font-size="13" textLength="176.332" font-family="Helvetica">Préparer une preuve atomique</text><text x="631.936" y="239.5" fill="#172B4D" font-size="13" textLength="273.876" font-family="Helvetica">avec le même contrat qu’une preuve composée</text><rect x="776.88" y="306.49" width="276.541" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="786.88" y="326.5" fill="#172B4D" font-size="13" textLength="221.114" font-family="Helvetica">Vérifier les types et identités qualifiées</text><text x="786.88" y="339.5" fill="#172B4D" font-size="13" textLength="256.541" font-family="Helvetica">ainsi que le contenant explicite si nécessaire</text><path d="M977.732,362.49 L977.732,424.49 L1220.595,424.49 L1220.595,372.49 L1210.595,362.49 L977.732,362.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1210.595,362.49 L1210.595,372.49 L1220.595,372.49 L1210.595,362.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="983.732" y="377.5" fill="#000" font-size="13" textLength="221.863" font-family="Helvetica">Seuls les groupes portent des enfants.</text><text x="983.732" y="390.5" fill="#000" font-size="13" textLength="208.825" font-family="Helvetica">Aucun renvoi récursif entre preuves.</text><text x="983.732" y="403.5" fill="#000" font-size="13" textLength="200.884" font-family="Helvetica">Propositions et conclusions restent</text><text x="983.732" y="416.5" fill="#000" font-size="13" textLength="219.699" font-family="Helvetica">dans la rédaction, pas dans la preuve.</text><polygon points="864.569,424.49,965.732,424.49,977.732,436.49,965.732,448.49,864.569,448.49,852.569,436.49,864.569,424.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="864.569" y="440" fill="#172B4D" font-size="13" textLength="101.163" font-family="Helvetica">Structure valide ?</text><text x="835.221" y="433.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="977.732" y="433.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="630.265" y="458.49" width="298.186" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="640.265" y="478.5" fill="#172B4D" font-size="13" textLength="278.186" font-family="Helvetica">Conserver les références aux sources originales</text><rect x="948.451" y="458.49" width="204.983" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="958.451" y="478.5" fill="#172B4D" font-size="13" textLength="184.983" font-family="Helvetica">Refuser la structure incohérente</text><ellipse cx="1050.943" cy="522.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1050.943" cy="522.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="615.936" y1="51.49" x2="615.936" y2="636.49" style="stroke:#000;stroke-width:1.5;"/><line x1="1225.595" y1="51.49" x2="1225.595" y2="636.49" style="stroke:#000;stroke-width:1.5;"/><line x1="170.773" y1="89.49" x2="170.773" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="166.773,99.49,170.773,109.49,174.773,99.49,170.773,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.011" y1="174.49" x2="317.051" y2="174.49" style="stroke:#444;stroke-width:1;"/><line x1="317.051" y1="174.49" x2="317.051" y2="206.49" style="stroke:#444;stroke-width:1;"/><polygon points="313.051,196.49,317.051,206.49,321.051,196.49,317.051,200.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="317.051" y1="252.49" x2="317.051" y2="274.49" style="stroke:#444;stroke-width:1;"/><line x1="317.051" y1="274.49" x2="182.773" y2="274.49" style="stroke:#444;stroke-width:1;"/><polygon points="192.773,270.49,182.773,274.49,192.773,278.49,188.773,274.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.773" y1="142.49" x2="170.773" y2="162.49" style="stroke:#444