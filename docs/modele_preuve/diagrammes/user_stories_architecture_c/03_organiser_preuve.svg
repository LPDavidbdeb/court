<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1254px;height:903px;background:#FFFFFF;" width="1254px" height="903px" viewBox="0 0 1254 903" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="418.009" y="30.78" fill="#000" font-size="14" textLength="416.261" font-weight="700" font-family="Helvetica">US-C-03 — Organiser les sources dans une preuve réutilisable</text></g><rect x="20" y="51.49" width="1207.279" height="13" fill="none" style="stroke:none;"/><ellipse cx="170.773" cy="79.49" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="58.884" y="109.49" width="223.779" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="68.884" y="129.5" fill="#172B4D" font-size="13" textLength="203.779" font-family="Helvetica">Créer ou ouvrir une Preuve durable</text><text x="68.884" y="142.5" fill="#172B4D" font-size="13" textLength="159.682" font-family="Helvetica">et choisir sa révision exacte</text><polygon points="64.536,346.99,277.011,346.99,289.011,358.99,277.011,370.99,64.536,370.99,52.536,358.99,64.536,346.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="64.536" y="362.5" fill="#172B4D" font-size="13" textLength="212.475" font-family="Helvetica">Appui constitué d’une seule source ?</text><text x="35.188" y="356" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="289.011" y="356" fill="#000" font-size="13" textLength="108.386" font-family="Helvetica">plusieurs éléments</text><rect x="191.434" y="390.99" width="251.232" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="201.434" y="411" fill="#172B4D" font-size="13" textLength="215.344" font-family="Helvetica">Organiser des groupes et des feuilles</text><text x="201.434" y="424" fill="#172B4D" font-size="13" textLength="231.232" font-family="Helvetica">référençant les éléments documentaires</text><polygon points="170.773,446.99,182.773,458.99,170.773,470.99,158.773,458.99,170.773,446.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M335.547,779.99 L335.547,800.49 L315.547,804.49 L335.547,808.49 L335.547,828.99 A0,0 0 0 0 335.547,828.99 L610.936,828.99 A0,0 0 0 0 610.936,828.99 L610.936,789.99 L600.936,779.99 L335.547,779.99 A0,0 0 0 0 335.547,779.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M600.936,779.99 L600.936,789.99 L610.936,789.99 L600.936,779.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="341.547" y="795" fill="#000" font-size="13" textLength="254.389" font-family="Helvetica">Le classement seul ne rattache aucun appui</text><text x="341.547" y="808" fill="#000" font-size="13" textLength="239.967" font-family="Helvetica">à un paragraphe et n’ajoute aucune pièce</text><text x="341.547" y="821" fill="#000" font-size="13" textLength="161.884" font-family="Helvetica">au bordereau de sa version.</text><rect x="26" y="787.99" width="289.547" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="808" fill="#172B4D" font-size="13" textLength="269.547" font-family="Helvetica">Retrouver cette preuve pour un usage ultérieur</text><ellipse cx="170.773" cy="859.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="170.773" cy="859.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="870.99" style="stroke:#000;stroke-width:1.5;"/><rect x="789.685" y="223.99" width="252.686" height="59" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="799.685" y="244" fill="#172B4D" font-size="13" textLength="232.686" font-family="Helvetica">Préparer une nouvelle révision complète</text><text x="799.685" y="257" fill="#172B4D" font-size="13" textLength="187.872" font-family="Helvetica">de la même Preuve avec filiation</text><text x="799.685" y="270" fill="#172B4D" font-size="13" textLength="111.998" font-family="Helvetica">et carte des nœuds</text><polygon points="768.252,175.49,1063.805,175.49,1075.805,187.49,1063.805,199.49,768.252,199.49,756.252,187.49,768.252,175.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="920.028" y="209.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="768.252" y="191" fill="#172B4D" font-size="13" textLength="295.553" font-family="Helvetica">Révision immuable ou usages non ciblés affectés ?</text><polygon points="916.028,302.99,928.028,314.99,916.028,326.99,904.028,314.99,916.028,302.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="622.813" y="390.99" width="293.876" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="632.813" y="411" fill="#172B4D" font-size="13" textLength="176.332" font-family="Helvetica">Préparer une preuve atomique</text><text x="632.813" y="424" fill="#172B4D" font-size="13" textLength="273.876" font-family="Helvetica">avec le même contrat qu’une preuve composée</text><rect x="777.758" y="490.99" width="276.541" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="787.758" y="511" fill="#172B4D" font-size="13" textLength="221.114" font-family="Helvetica">Vérifier les types et identités qualifiées</text><text x="787.758" y="524" fill="#172B4D" font-size="13" textLength="256.541" font-family="Helvetica">ainsi que le contenant explicite si nécessaire</text><path d="M978.609,546.99 L978.609,608.99 L1221.473,608.99 L1221.473,556.99 L1211.473,546.99 L978.609,546.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1211.473,546.99 L1211.473,556.99 L1221.473,556.99 L1211.473,546.99" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="984.609" y="562" fill="#000" font-size="13" textLength="221.863" font-family="Helvetica">Seuls les groupes portent des enfants.</text><text x="984.609" y="575" fill="#000" font-size="13" textLength="208.825" font-family="Helvetica">Aucun renvoi récursif entre preuves.</text><text x="984.609" y="588" fill="#000" font-size="13" textLength="200.884" font-family="Helvetica">Propositions et conclusions restent</text><text x="984.609" y="601" fill="#000" font-size="13" textLength="219.699" font-family="Helvetica">dans la rédaction, pas dans la preuve.</text><polygon points="865.447,608.99,966.609,608.99,978.609,620.99,966.609,632.99,865.447,632.99,853.447,620.99,865.447,608.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="865.447" y="624.5" fill="#172B4D" font-size="13" textLength="101.163" font-family="Helvetica">Structure valide ?</text><text x="836.099" y="618" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="978.609" y="618" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><rect x="621.936" y="642.99" width="310.462" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="631.936" y="663" fill="#172B4D" font-size="13" textLength="290.462" font-family="Helvetica">Conserver atomiquement la révision et ses nœuds</text><text x="631.936" y="676" fill="#172B4D" font-size="13" textLength="257.239" font-family="Helvetica">avec leurs références aux sources originales</text><rect x="644.311" y="721.99" width="265.711" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="654.311" y="742" fill="#172B4D" font-size="13" textLength="229.087" font-family="Helvetica">Appliquer les seuls repointages décidés</text><text x="654.311" y="755" fill="#172B4D" font-size="13" textLength="245.711" font-family="Helvetica">d’usages dans une VersionActe modifiable</text><rect x="952.398" y="642.99" width="204.983" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="962.398" y="663" fill="#172B4D" font-size="13" textLength="184.983" font-family="Helvetica">Refuser la structure incohérente</text><ellipse cx="1054.89" cy="719.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1054.89" cy="719.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="615.936" y1="51.49" x2="615.936" y2="870.99" style="stroke:#000;stroke-width:1.5;"/><line x1="1226.473" y1="51.49" x2="1226.473" y2="870.99" style="stroke:#000;stroke-width:1.5;"/><line x1="170.773" y1="89.49" x2="170.773" y2="109.49" style="stroke:#444;stroke-width:1;"/><polygon points="166.773,99.49,170.773,109.49,174.773,99.49,170.773,103.49" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="289.011" y1="358.99" x2="317.051" y2="358.99" style="stroke:#444;stroke-width:1;"/><line x1="317.051" y1="358.99" x2="317.051" y2="390.99" style="stroke:#444;stroke-width:1;"/><polygon points="313.051,380.99,317.051,390.99,321.051,380.99,317.051,384.99" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="317.051" y1="436.99" x2="317.051" y2="458.99" style="stroke:#444;stroke-width:1;"/><line x1="317.051" y1="458.99" x2="182.773" y2="458.99" style="stroke:#444;stroke-width:1;"/><polygon points="192.773,454.99,182.773,458.99,192.773,462.99,188.773,458.99" fill="#444" style="stroke:#444;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="170.773" y1="820.99" x2="170.773" y2="848.99" style="stroke:#444;stroke-width:1;"/><polygon points="166.773,838.99,170.773,848.99,174.773,8