239,221.49 L412.239,211.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="192.65" y="226.5" fill="#000" font-size="13" textLength="214.589" font-family="Helvetica">Des renvois réciproques sont permis.</text><rect x="26" y="206.49" width="140.65" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="226.5" fill="#172B4D" font-size="13" textLength="120.65" font-family="Helvetica">Déclarer un RENVOI</text><rect x="773.701" y="206.49" width="265.642" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="783.701" y="226.5" fill="#172B4D" font-size="13" textLength="245.642" font-family="Helvetica">Déclarer une DEPENDANCE_DECLAREE</text><polygon points="501.423,740.49,513.423,752.49,501.423,764.49,489.423,752.49,501.423,740.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M616.688,895.49 L616.688,915.99 L596.688,919.99 L616.688,923.99 L616.688,944.49 A0,0 0 0 0 616.688,944.49 L814.756,944.49 A0,0 0 0 0 814.756,944.49 L814.756,905.49 L804.756,895.49 L616.688,895.49 A0,0 0 0 0 616.688,895.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M804.756,895.49 L804.756,905.49 L814.756,905.49 L804.756,895.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="622.688" y="910.5" fill="#000" font-size="13" textLength="171.279" font-family="Helvetica">Un lien ne copie pas de texte,</text><text x="622.688" y="923.5" fill="#000" font-size="13" textLength="173.462" font-family="Helvetica">ne sélectionne aucune preuve</text><text x="622.688" y="936.5" fill="#000" font-size="13" textLength="177.068" font-family="Helvetica">et ne valide pas une inférence.</text><rect x="406.159" y="903.49" width="190.53" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="416.159" y="923.5" fill="#172B4D" font-size="13" textLength="170.53" font-family="Helvetica">Naviguer vers le passage cité</text><ellipse cx="501.423" cy="975.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="501.423" cy="975.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="51.49" x2="20" y2="986.49" style="stroke:#000;stroke-width:1.5;"/><rect x="1430.587" y="259.49" width="266.41" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1440.587" y="279.5" fill="#172B4D" font-size="13" textLength="246.41" font-family="Helvetica">Contrôler les cycles avec les dépendances</text><text x="1440.587" y="292.5" fill="#172B4D" font-size="13" textLength="219.629" font-family="Helvetica">actives, y compris celles à réexaminer</text><rect x="1462.744" y="373.99" width="202.095" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1472.744" y="394" fill="#172B4D" font-size="13" textLength="182.095" font-family="Helvetica">Refuser le lien sans effet partiel</text><ellipse cx="1563.792" cy="446.99" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1563.792" cy="446.99" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="1518.99,325.49,1608.593,325.49,1620.593,337.49,1608.593,349.49,1518.99,349.49,1506.99,337.49,1518.99,325.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1567.792" y="359.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="1518.99" y="341" fill="#172B4D" font-size="13" textLength="89.604" font-family="Helvetica">Cycle détecté ?</text><polygon points="1490.086,548.49,1637.497,548.49,1649.497,560.49,1637.497,572.49,1490.086,572.49,1478.086,560.49,1490.086,548.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1490.086" y="564" fill="#172B4D" font-size="13" textLength="147.412" font-family="Helvetica">Prémisse externe gelée ?</text><text x="1460.738" y="557.5" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="1649.497" y="557.5" fill="#000" font-size="13" textLength="21.69" font-family="Helvetica">non</text><path d="M1439.129,582.49 L1439.129,609.49 L1419.129,613.49 L1439.129,617.49 L1439.129,644.49 A0,0 0 0 0 1439.129,644.49 L1723.131,644.49 A0,0 0 0 0 1723.131,644.49 L1723.131,592.49 L1713.131,582.49 L1439.129,582.49 A0,0 0 0 0 1439.129,582.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><path d="M1713.131,582.49 L1713.131,592.49 L1723.131,592.49 L1713.131,582.49" style="stroke:#98723C;stroke-width:0.5;" fill="#FFF4E0"/><text x="1445.129" y="597.5" fill="#000" font-size="13" textLength="206.673" font-family="Helvetica">Le gel conserve les liens pertinents;</text><text x="1445.129" y="610.5" fill="#000" font-size="13" textLength="195.832" font-family="Helvetica">les fondements de la version cible</text><text x="1445.129" y="623.5" fill="#000" font-size="13" textLength="263.002" font-family="Helvetica">se retrouvent via ses UP et révisions exactes.</text><text x="1445.129" y="636.5" fill="#000" font-size="13" textLength="201.627" font-family="Helvetica">Aucun renvoi entre preuves ajouté.</text><rect x="1119.508" y="596.99" width="299.621" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1129.508" y="617" fill="#172B4D" font-size="13" textLength="279.621" font-family="Helvetica">Conserver version et occurrences cibles exactes</text><rect x="1733.131" y="582.49" width="230.266" height="59" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1743.131" y="602.5" fill="#172B4D" font-size="13" textLength="185.72" font-family="Helvetica">Demander le gel de la référence</text><text x="1743.131" y="615.5" fill="#172B4D" font-size="13" textLength="210.266" font-family="Helvetica">ou la reprise explicite de la prémisse</text><text x="1743.131" y="628.5" fill="#172B4D" font-size="13" textLength="130.787" font-family="Helvetica">avant une sortie stricte</text><ellipse cx="1848.265" cy="675.49" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1848.265" cy="675.49" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="1463.349,499.99,1664.234,499.99,1676.234,511.99,1664.234,523.99,1463.349,523.99,1451.349,511.99,1463.349,499.99" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1567.792" y="534" fill="#000" font-size="13" textLength="17.348" font-family="Helvetica">oui</text><text x="1463.349" y="515.5" fill="#172B4D" font-size="13" textLength="200.884" font-family="Helvetica">Prémisse dans une autre version ?</text><polygon points="1563.792,706.49,1575.792,718.49,1563.792,730.49,1551.792,718.49,1563.792,706.49" fill="#FFF4E0" style="stroke:#98723C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1049.343" y="784.49" width="218.701" height="46" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1059.343" y="804.5" fill="#172B4D" font-size="13" textLength="158.247" font-family="Helvetica">Conserver le lien déclaré et</text><text x="1059.343" y="817.5" fill="#172B4D" font-size="13" textLength="198.701" font-family="Helvetica">les textes d’occurrences examinés</text><rect x="1052.231" y="850.49" width="212.924" height="33" fill="#EAF2FB" style="stroke:#527296;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1062.231" y="870.5" fill="#172B4D" font-size="13" textLength="192.924" font-family="Helvetica">Contrôler sa fraîcheur à la lecture</text><line x1="1043.343" y1="51.49" x2="1043.343" y2="986.49" style="stroke:#000;stroke-width:1.5;"/><line x1="1996.398" y1="51.49" x2="1996.398" y2="986.49" style="stroke:#000;stroke-width:1.5;"/><line x1="501.423" y1="89.49" x2="501.423" y2="109.49" style="stroke:#444;stroke-wid