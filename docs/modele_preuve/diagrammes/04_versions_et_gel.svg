<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1000px;height:1068px;background:#FFFFFF;" width="1000px" height="1068px" viewBox="0 0 1000 1068" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="4"><text x="390.087" y="30.78" fill="#000" font-size="14" textLength="217.834" font-weight="700" font-family="Helvetica">Versions, gel et copie du chemin</text></g><rect x="20" y="52.64" width="938.609" height="18" fill="none" style="stroke:none;"/><ellipse cx="156.053" cy="85.64" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M289.444,137.64 L289.444,151.64 L269.444,155.64 L289.444,159.64 L289.444,173.64 A0,0 0 0 0 289.444,173.64 L462.21,173.64 A0,0 0 0 0 462.21,173.64 L462.21,147.64 L452.21,137.64 L289.444,137.64 A0,0 0 0 0 289.444,137.64" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M452.21,137.64 L452.21,147.64 L462.21,147.64 L452.21,137.64" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="295.444" y="152.65" fill="#000" font-size="13" textLength="111.585" font-family="Helvetica">Gelée dès l'import :</text><text x="295.444" y="165.65" fill="#000" font-size="13" textLength="151.766" font-family="Helvetica">elle décrit un acte déposé.</text><rect x="42.661" y="115.64" width="226.783" height="80" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="52.661" y="134.88" fill="#000" font-size="12" textLength="121.746" font-family="Helvetica">Version 1 = juillet 2026</text><text x="52.661" y="146.88" fill="#000" font-size="12" textLength="166.09" font-family="Helvetica">(import ponctuel, hors du pont :</text><text x="52.661" y="158.88" fill="#000" font-size="12" textLength="206.783" font-family="Helvetica">BordereauDepotJuillet.cote → entrées,</text><text x="52.661" y="170.88" fill="#000" font-size="12" textLength="157.781" font-family="Helvetica">la demande = doc 9, déjà figé</text><text x="52.661" y="182.88" fill="#000" font-size="12" textLength="124.723" font-family="Helvetica">par ReferentHistorique)</text><path d="M270.24,213.14 L270.24,233.64 L250.24,237.64 L270.24,241.64 L270.24,262.14 A0,0 0 0 0 270.24,262.14 L491.318,262.14 A0,0 0 0 0 491.318,262.14 L491.318,223.14 L481.318,213.14 L270.24,213.14 A0,0 0 0 0 270.24,213.14" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M481.318,213.14 L481.318,223.14 L491.318,223.14 L481.318,213.14" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="276.24" y="228.15" fill="#000" font-size="13" textLength="200.078" font-family="Helvetica">Copier l'acte ne copie rien d'autre :</text><text x="276.24" y="241.15" fill="#000" font-size="13" textLength="195.114" font-family="Helvetica">ses paragraphes pointent vers les</text><text x="276.24" y="254.15" fill="#000" font-size="13" textLength="184.253" font-family="Helvetica">mêmes démonstrations, gelées.</text><rect x="61.865" y="215.64" width="188.375" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="71.865" y="234.88" fill="#000" font-size="12" textLength="168.375" font-family="Helvetica">Copie de l'acte en BROUILLON</text><text x="71.865" y="246.88" fill="#000" font-size="12" textLength="106.389" font-family="Helvetica">(doc 10 = version 2)</text><polygon points="156.053,282.14,168.053,294.14,156.053,306.14,144.053,294.14,156.053,282.14" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="26" y="773.11" width="260.105" height="92" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="792.35" fill="#000" font-size="12" textLength="202.74" font-family="Helvetica">Passage BROUILLON → DÉPOSÉE :</text><text x="36" y="804.35" fill="#000" font-size="12" textLength="184.365" font-family="Helvetica">— geler l'acte (ReferentHistorique)</text><text x="36" y="816.35" fill="#000" font-size="12" textLength="163.705" font-family="Helvetica">— enregistrer l'utilisation gelée</text><text x="42.668" y="828.35" fill="#000" font-size="12" textLength="183.41" font-family="Helvetica">(démonstrations, preuves, nœuds)</text><text x="36" y="840.35" fill="#000" font-size="12" textLength="175.436" font-family="Helvetica">— figer les entrées du bordereau</text><text x="36" y="852.35" fill="#000" font-size="12" textLength="240.105" font-family="Helvetica">— un même numéro de version pour les trois</text><rect x="28.314" y="885.11" width="255.477" height="68" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="38.314" y="904.35" fill="#000" font-size="12" textLength="235.477" font-family="Helvetica">Correspondance avec la version précédente</text><text x="38.314" y="916.35" fill="#000" font-size="12" textLength="209.115" font-family="Helvetica">par modèle + PK (journal de redirection</text><text x="38.314" y="928.35" fill="#000" font-size="12" textLength="154.758" font-family="Helvetica">pour les citations fusionnées,</text><text x="38.314" y="940.35" fill="#000" font-size="12" textLength="202.746" font-family="Helvetica">1 → N pour les liasses et fils de juillet)</text><rect x="41.513" y="973.11" width="229.08" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.513" y="992.35" fill="#000" font-size="12" textLength="209.08" font-family="Helvetica">Copie de l'acte pour la version suivante</text><ellipse cx="156.053" cy="1036.11" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="156.053" cy="1036.11" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="52.64" x2="20" y2="1047.11" style="stroke:#000;stroke-width:1.5;"/><rect x="567.528" y="326.14" width="300.172" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="577.528" y="345.38" fill="#000" font-size="12" textLength="280.172" font-family="Helvetica">Modifier une démonstration, une preuve ou un nœud</text><polygon points="613.836,378.14,821.391,378.14,833.391,390.14,821.391,402.14,613.836,402.14,601.836,390.14,613.836,378.14" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="613.836" y="393.11" fill="#000" font-size="11" textLength="207.555" font-family="Helvetica">L'objet est-il utilisé par une version gelée ?</text><text x="583.483" y="387.61" fill="#000" font-size="11" textLength="18.353" font-family="Helvetica">non</text><text x="833.391" y="387.61" fill="#000" font-size="11" textLength="14.679" font-family="Helvetica">oui</text><rect x="502.318" y="412.14" width="179.035" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="512.318" y="431.38" fill="#000" font-size="12" textLength="94.717" font-family="Helvetica">Modifier en place,</text><text x="512.318" y="443.38" fill="#000" font-size="12" textLength="159.035" font-family="Helvetica">les liens qui l'avaient confirmé</text><text x="512.318" y="455.38" fill="#000" font-size="12" textLength="135.41" font-family="Helvetica">passent « à réexaminer »</text><rect x="743.555" y="412.14" width="199.672" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="753.555" y="431.38" fill="#000" font-size="12" textLength="179.672" font-family="Helvetica">Copier l'objet (issu_de = l'original)</text><rect x="742.855" y="479.14" width="201.072" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="752.855" y="498.38" fill="#000" font-size="12" textLength="142.072" font-family="Helvetica">Copier ses ancêtres gelés,</text><text x="752.855" y="510.38" fill="#000" font-size="12" textLength="181.072" font-family="Helvetica">jusqu'au premier ancêtre non gelé</text><text x="752.855" y="522.38" fill="#000" font-size="12" textLength="95.379" font-family="Helvetica">(copie du chemin)</text><rect x="733.673" y="555.14" width="219.436" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="743.673" y="574.38" fill="#000" font-size="12" textLength="199.436" font-family="Helvetica">Repointer les brouillons vers la copie,</text><text x="743.673" y="586.38" fill="#000" font-size="12" textLength="193.066" font-family="Helvetica">les versions gelées gardent l'original</text><polygon points="717.614,605.14,729.614,617.14,717.614,629.14,705.614,617.14,717.614,605.14" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="593.874" y="649.14" width="247.479" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="603.874" y="668.38" fill="#000" font-size="12" textLength="227.479" font-family="Helvetica">Bordereau du brouillon recalculé à la volée</text><text x="603.874" y="680.38" fill="#000" font-size="12" textLength="222.779" font-family="Helvetica">(rangs chronologiques, cotes, sous-cotes)</text><polygon points="676.028,713.14,759.199,713.14,771.199,725.14,759.199,737.14,676.028,737.14,664.028,725.14,676.028,713.14" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="676.028" y="728.11" fill="#000" font-size="11" textLength="83.171" font-family="Helvetica">Dépôt ou envoi ?</text><text x="771.199" y="722.61" fill="#000" font-size="11" textLength="54.425" font-family="Helvetica">pas encore</text><line x1="496.318" y1="52.64" x2="496.318" y2="1047.11" style="stroke:#000;stroke-width:1.5;"/><line x1="957.109" y1="52.64" x2="957.109" y2="1047.11" style="stroke:#000;stroke-width:1.5;"/><line x1="156.053" y1="95.64" x2="156.053" y2="115.64" style="stroke:#181818;stroke-width:1;"/><polygon points="152.053,105.64,156.053,115.64,160.053,105.64,