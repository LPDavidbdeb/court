<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="WBS" style="width:2184px;height:1243px;background:#FFFFFF;" width="2184px" height="1243px" viewBox="0 0 2184 1243" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="5"><text x="877.26" y="30.78" fill="#000" font-size="14" textLength="427.902" font-weight="700" font-family="Helvetica">Arbre de preuve — les soins du soir pendant les cours de danse</text></g><line x1="148.201" y1="155" x2="148.201" y2="175" style="stroke:#181818;stroke-width:1.5;"/><rect x="20" y="175" width="256.402" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="30" y="194.24" fill="#000" font-size="12" textLength="236.402" font-family="Helvetica">A. La mère s'absentait le soir pour ses cours</text><text x="30" y="206.24" fill="#000" font-size="12" textLength="35.355" font-family="Helvetica">[établi]</text><line x1="148.201" y1="262" x2="158.201" y2="262" style="stroke:#181818;stroke-width:1.5;"/><rect x="158.201" y="234" width="240.137" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="168.201" y="253.24" fill="#000" font-size="12" textLength="204.146" font-family="Helvetica">A1. Continuité 1999-2016, sans pause</text><text x="168.201" y="265.24" fill="#000" font-size="12" textLength="166.09" font-family="Helvetica">P-83 (biographie) · P-17 (2015)</text><text x="168.201" y="277.24" fill="#000" font-size="12" textLength="220.137" font-family="Helvetica">email 305 (2016) · clavardage 127 (2014)</text><line x1="148.201" y1="339" x2="158.201" y2="339" style="stroke:#181818;stroke-width:1.5;"/><rect x="158.201" y="305" width="292.83" height="68" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="168.201" y="324.24" fill="#000" font-size="12" textLength="159.41" font-family="Helvetica">A2. Structure : deux sessions,</text><text x="168.201" y="336.24" fill="#000" font-size="12" textLength="260.139" font-family="Helvetica">plus de 30 semaines, même jour toute la session</text><text x="168.201" y="348.24" fill="#000" font-size="12" textLength="89.367" font-family="Helvetica">P-90 (calendrier)</text><text x="168.201" y="360.24" fill="#000" font-size="12" textLength="272.83" font-family="Helvetica">R : le calendrier ne date pas les années historiques</text><line x1="148.201" y1="404" x2="158.201" y2="404" style="stroke:#181818;stroke-width:1.5;"/><rect x="158.201" y="388" width="135.389" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="168.201" y="407.24" fill="#000" font-size="12" textLength="115.389" font-family="Helvetica">A3. Jours par session</text><line x1="225.896" y1="457" x2="235.896" y2="457" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="435" width="257.451" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="454.24" fill="#000" font-size="12" textLength="237.451" font-family="Helvetica">Hiver 2010 — un cours (spectacle, event 19)</text><text x="245.896" y="466.24" fill="#000" font-size="12" textLength="218.121" font-family="Helvetica">jour non déterminé · Alexia de 3 à 8 mois</text><line x1="225.896" y1="516" x2="235.896" y2="516" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="494" width="249.43" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="513.24" fill="#000" font-size="12" textLength="229.43" font-family="Helvetica">Automne 2010 — mardi et mercredi [direct]</text><text x="245.896" y="525.24" fill="#000" font-size="12" textLength="98.063" font-family="Helvetica">emails 81, 80, 100</text><line x1="225.896" y1="575" x2="235.896" y2="575" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="553" width="304.836" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="572.24" fill="#000" font-size="12" textLength="266.086" font-family="Helvetica">Hiver-printemps 2011 — mardi et mercredi [direct]</text><text x="245.896" y="584.24" fill="#000" font-size="12" textLength="284.836" font-family="Helvetica">emails 114, 116 · events 46, 52 · spectacle (event 78)</text><line x1="225.896" y1="634" x2="235.896" y2="634" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="612" width="222.734" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="631.24" fill="#000" font-size="12" textLength="202.734" font-family="Helvetica">Hiver-printemps 2012 — mardi [direct]</text><text x="245.896" y="643.24" fill="#000" font-size="12" textLength="161.426" font-family="Helvetica">email 347 (doublon : email 48)</text><line x1="225.896" y1="699" x2="235.896" y2="699" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="671" width="270.799" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="690.24" fill="#000" font-size="12" textLength="180.059" font-family="Helvetica">Hiver-printemps 2013 — mercredi</text><text x="245.896" y="702.24" fill="#000" font-size="12" textLength="250.799" font-family="Helvetica">[document : fortement soutenu · avec T : établi]</text><text x="245.896" y="714.24" fill="#000" font-size="12" textLength="140.057" font-family="Helvetica">email 474 · Nicolas 3 mois</text><line x1="225.896" y1="770" x2="235.896" y2="770" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="742" width="250.789" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="761.24" fill="#000" font-size="12" textLength="122.08" font-family="Helvetica">Automne 2013 — lundi</text><text x="245.896" y="773.24" fill="#000" font-size="12" textLength="230.789" font-family="Helvetica">[document : non déterminé · avec T : établi]</text><text x="245.896" y="785.24" fill="#000" font-size="12" textLength="220.096" font-family="Helvetica">fil 131 (emails 498-499) · Nicolas 10 mois</text><line x1="225.896" y1="835" x2="235.896" y2="835" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="813" width="218.082" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="832.24" fill="#000" font-size="12" textLength="198.082" font-family="Helvetica">Hiver-printemps 2014 — lundi [direct]</text><text x="245.896" y="844.24" fill="#000" font-size="12" textLength="85.4" font-family="Helvetica">events 274, 278</text><line x1="225.896" y1="894" x2="235.896" y2="894" style="stroke:#181818;stroke-width:1.5;"/><rect x="235.896" y="872" width="211.414" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="245.896" y="891.24" fill="#000" font-size="12" textLength="191.414" font-family="Helvetica">Autres sessions — au moins un soir</text><text x="245.896" y="903.24" fill="#000" font-size="12" textLength="168.428" font-family="Helvetica">jour non déterminé · → A1 + A2</text><line x1="225.896" y1="420" x2="225.896" y2="894" style="stroke:#181818;stroke-width:1.5;"/><line x1="148.201" y1="947" x2="158.201" y2="947" style="stroke:#181818;stroke-width:1.5;"/><rect x="158.201" y="931" width="180.078" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="168.201" y="950.24" fill="#000" font-size="12" textLength="160.078" font-family="Helvetica">A4. La théorie des visites (LP)</text><line x1="248.24" y1="1000" x2="258.24" y2="1000" style="stroke:#181818;stroke-width:1.5;"/><rect x="258.24" y="978" width="290.474" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="268.24" y="997.24" fill="#000" font-size="12" textLength="270.474" font-family="Helvetica">visite de Johanne ⇒ absence de la mère (toujours)</text><text x="268.24" y="1009.24" fill="#000" font-size="12" textLength="176.08" font-family="Helvetica">email 82 (rupture) · emails 81, 80</text><line x1="248.24" y1="1053" x2="258.24" y2="1053" style="stroke:#181818;stroke-width:1.5;"/><rect x="258.24" y="1037" width="216.516" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="268.24" y="1056.24" fill="#000" font-size="12" textLength="196.516" font-family="Helvetica">R : non-visite ⇏ présence de la mère</text><line x1="248.24" y1="1100" x2="258.24" y2="1100" style="stroke:#181818;stroke-width:1.5;"/><rect x="258.24" y="1084" width="211.742" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="268.24" y="1103.24" fill="#000" font-size="12" textLength="191.742" font-family="Helvetica">cours ⇒ absence (exceptions rares)</text><line x1="248.24" y1="1147" x2="258.24" y2="1147" style="stroke:#181818;stroke-width:1.5;"/><rect x="258.24" y="1131" width="196.056" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="268.24" y="1150.24" fill="#000" font-size="12" textLength="176.056" font-family="Helvetica">cours ⇒ spectacle de fin d'année</text><line x1="248.24" y1="1200" x2="258.24" y2="1200" style="stroke:#181818;stroke-width:1.5;"/><rect x="258.24" y="1178" width="290.17" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="268.24" y="1197.24" fill="#000" font-size="12" textLength="270.17" font-family="Helvetica">règle des sessions : un jour ne vaut pour une autre</text><text x="268.24" y="1209.24" fill="#000" font-size="12" textLength="220.125" font-family="Helvetica">session que si celle-ci a son propre appui</text><line x1="248.24" y1="963" x2="248.24" y2="1200" style="stroke:#181818;stroke-width:1.5;"/><line x1="148.201" y1="219" x2="148.201" y2="947" style="stroke:#181818;stroke-width:1.5;"/><line x1="716.126" y1="155" x2="716.126" y2="175" style="stroke:#181818;stroke-width:1.5;"/><rect x="568.715" y="175" width="294.822" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="578.715" y="194.24" fill="#000" font-size="12" textLength="274.822" font-family="Helvetica">B. Pendant ces absences, le père assurait les soins</text><text x="578.715" y="206.24" fill="#000" font-size="12" textLength="144.07" font-family="Helvetica">[établi — « normalement »]</text><line x1="716.126" y1="256" x2="726.126" y2="256" style="stroke:#181818;stroke-width:1.5;"/><rect x="726.126" y="234" width="246.793" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="736.126" y="253.24" fill="#000" font-size="12" textLength="226.793" font-family="Helvetica">B1. Routines : Alexia seule (events 46, 52)</text><text x="736.126" y="265.24" fill="#000" font-size="12" textLength="184.119" font-family="Helvetica">les deux enfants (events 274, 278)</text><line x1="716.126" y1="309" x2="726.126" y2="309" style="stroke:#181818;stroke-width:1.5;"/><rect x="726.126" y="293" width="242.135" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="736.126" y="312.24" fill="#000" font-size="12" textLength="222.135" font-family="Helvetica">B2. Adaptation de son horaire (email 347)</text><line x1="716.126" y1="368" x2="726.126" y2="368" style="stroke:#181818;stroke-width:1.5;"/><rect x="726.126" y="340" width="234.799" height="56" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="736.126" y="359.24" fill="#000" font-size="12" textLength="214.799" font-family="Helvetica">B3. Il coordonnait les visites de Johanne</text><text x="736.126" y="371.24" fill="#000" font-size="12" textLength="197.443" font-family="Helvetica">R : exceptions à la garde en solitaire,</text><text x="736.126" y="383.24" fill="#000" font-size="12" textLength="120.082" font-family="Helvetica">non à la responsabilité</text><line x1="716.126" y1="427" x2="726.126" y2="427" style="stroke:#181818;stroke-width:1.5;"/><rect x="726.126" y="411" width="154.057" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="736.126" y="430.24" fill="#000" font-size="12" textLength="134.057" font-family="Helvetica">B4. Le mode normal — T</text><line x1="716.126" y1="480" x2="726.126" y2="480" style="stroke:#181818;stroke-width:1.5;"/><rect x="726.126" y="458" width="307.496" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="736.126" y="477.24" fill="#000" font-size="12" textLength="274.143" font-family="Helvetica">B5. Deux configurations : Alexia nourrisson (2010) ;</text><text x="736.126" y="489.24" fill="#000" font-size="12" textLength="287.496" font-family="Helvetica">Nicolas nourrisson et Alexia à 3 ans (2013), puis 2014</text><line x1="716.126" y1="551" x2="726.126" y2="551" style="stroke:#181818;stroke-width:1.5;"/><rect x="726.126" y="517" width="324.189" height="68" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="736.126" y="536.24" fill="#000" font-size="12" textLength="304.189" font-family="Helvetica">B6. La fonction devait être remplie ; aucun autre candidat</text><text x="736.126" y="548.24" fill="#000" font-size="12" textLength="242.133" font-family="Helvetica">email 305 « aide familiale … soirs de danse »</text><text x="736.126" y="560.24" fill="#000" font-size="12" textLength="276.457" font-family="Helvetica">email 305 (sœurs = accès du dimanche) · email 304</text><text x="736.126" y="572.24" fill="#000" font-size="12" textLength="214.816" font-family="Helvetica">P-19 § 17 · R : 2016, non la cohabitation</text><line x1="716.126" y1="219" x2="716.126" y2="551" style="stroke:#181818;stroke-width:1.5;"/><line x1="1116.667" y1="155" x2="1116.667" y2="175" style="stroke:#181818;stroke-width:1.5;"/><rect x="1070.315" y="175" width="92.703" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1080.315" y="194.24" fill="#000" font-size="12" textLength="72.703" font-family="Helvetica">C. Fréquence</text><line x1="1116.667" y1="244" x2="1126.667" y2="244" style="stroke:#181818;stroke-width:1.5;"/><rect x="1126.667" y="222" width="320.164" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1136.667" y="241.24" fill="#000" font-size="12" textLength="300.164" font-family="Helvetica">C1. Plancher : un soir par semaine pendant les sessions</text><text x="1136.667" y="253.24" fill="#000" font-size="12" textLength="276.82" font-family="Helvetica">→ A1 + A2 + A3 · email 305 (catégorie permanente)</text><line x1="1116.667" y1="297" x2="1126.667" y2="297" style="stroke:#181818;stroke-width:1.5;"/><rect x="1126.667" y="281" width="272.129" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1136.667" y="300.24" fill="#000" font-size="12" textLength="252.129" font-family="Helvetica">C2. Deux soirs documentés (2010, 2011) → A3</text><line x1="1116.667" y1="350" x2="1126.667" y2="350" style="stroke:#181818;stroke-width:1.5;"/><rect x="1126.667" y="328" width="243.471" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1136.667" y="347.24" fill="#000" font-size="12" textLength="205.025" font-family="Helvetica">C3. Jusqu'à trois — T · email 7 (cadre)</text><text x="1136.667" y="359.24" fill="#000" font-size="12" textLength="223.471" font-family="Helvetica">email 306 (ne conteste pas ; pas un aveu)</text><line x1="1116.667" y1="403" x2="1126.667" y2="403" style="stroke:#181818;stroke-width:1.5;"/><rect x="1126.667" y="387" width="186.752" height="32" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1136.667" y="406.24" fill="#000" font-size="12" textLength="166.752" font-family="Helvetica">C4. Plus de 30 semaines → A2</text><line x1="1116.667" y1="207" x2="1116.667" y2="403" style="stroke:#181818;stroke-width:1.5;"/><line x1="1616.067" y1="155" x2="1616.067" y2="175" style="stroke:#181818;stroke-width:1.5;"/><rect x="1466.831" y="175" width="298.473" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1476.831" y="194.24" fill="#000" font-size="12" textLength="235.77" font-family="Helvetica">D. 2016 : la participation n'est pas contestée</text><text x="1476.831" y="206.24" fill="#000" font-size="12" textLength="278.473" font-family="Helvetica">email 7 (cadre) · email 306 (« pas 50 % » = un seuil)</text><line x1="1974.363" y1="155" x2="1974.363" y2="175" style="stroke:#181818;stroke-width:1.5;"/><rect x="1785.304" y="175" width="378.119" height="44" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="1795.304" y="194.24" fill="#000" font-size="12" textLength="354.85" font-family="Helvetica">RÉSERVES — pas sans exception · aucun nombre exact de cours</text><text x="1795.304" y="206.24" fill="#000" font-size="12" textLength="358.119" font-family="Helvetica">l'aide de la grand-mère est compatible · la danse n'est pas critiquée</text><line x1="148.201" y1="155" x2="1974.363" y2="155" style="stroke:#181818;stroke-width:1.5;"/><rect x="912.052" y="55" width="298.461" height="80" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/><text x="922.052" y="74.24" fill="#000" font-size="12" textLength="277.453" font-family="Helvetica">FAIT — le père assurait les soins des enfants le soir</text><text x="922.052" y="86.24" fill="#000" font-size="12" textLength="278.461" font-family="Helvetica">quand la mère s'absentait pour ses cours de danse :</text><text x="922.052" y="98.24" fill="#000" font-size="12" textLength="275.748" font-family="Helvetica">au minimum une fois, jusqu'à trois fois par semaine,</text><text x="922.052" y="110.24" fill="#000" font-size="12" textLength="167.449" font-family="Helvetica">plus de 30 semaines par année</text><text x="922.052" y="122.24" fill="#000" font-size="12" textLength="183.111" font-family="Helvetica">[établi — document + témoignage]</text><line x1="1061.282" y1="135" x2="1061.282" y2="155" style="stroke:#181818;stroke-width:1.5;"/><?plantuml-src xLTDRXit5Dxx56zJM4ejGIF9jkGWG1pNGH8OZk6usSI1GStGCjCPpeGSAbvsrQ2h0caFq5KJfmVe8ZiBlKXEqk-H8sciE44Fe8sjcI7Vp_U-zptolYs5AT-CB7LwPyACZ3nBXBPoRPqErlqp9OxEXIefaPGAyb_fyyz_qDxJmxtzevF7Jm_FZextVto-tyuIkdv__PwYQ8EYBRfBvSNqAZTAyjw38sfqehCuTyO67sUPD1ARcd3s8f5ZCxrwwIsBed0Asu_f7k6bbMOYyNY2nt9wbULgh